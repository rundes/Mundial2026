<style>
  /* Estilos base que NO dependen de Tailwind: si la CDN falla, la app sigue siendo legible. */
  html, body { background: #fff; color: #111827; margin: 0; }
  body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; line-height: 1.4; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  textarea { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
  /* Inputs en iOS sin zoom automático al hacer focus (mínimo 16px) */
  input, textarea { font-size: 16px !important; }
  /* Previene selección de texto en botones (Safari) */
  button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* Mejor scroll en iOS */
  * { -webkit-overflow-scrolling: touch; }
  /* Safe area para iPhones con notch */
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  /* Accesibilidad: foco visible */
  button:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-visible, a:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  /* Pantalla de boot para evitar flash sin estilos */
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #fff; z-index: 9999; font-size: 14px; color: #6b7280; }
  #boot .b-dot { width: 10px; height: 10px; border-radius: 9999px; background: #2563eb; animation: bdot 1s infinite ease-in-out; }
  @keyframes bdot { 0%,100% { transform: scale(0.7); opacity: .55 } 50% { transform: scale(1.2); opacity: 1 } }
  #boot .b-title { font-weight: 700; color: #111827; font-size: 16px; }

  /* Siluetas tipo busto (torso + cabeza) con diferentes peinados.
     Dibujos propios formados por figuras geométricas básicas (paths,
     ellipses y circles). No representan a ningún jugador en particular.
     Usamos mask-image + background-color: currentColor para que la
     silueta tome el color del texto de la casilla.
     Variantes:
       1 - Pelo corto / brush cut
       2 - Rizado / fluffy
       3 - Pelo medio-largo (cae a los hombros)
       4 - Rapado / pelado
       5 - Pelo ondulado medio
       6 - Top knot / manbun */
  :root {

<script>
// ====== DETECCIÓN DE WEBVIEW EMBEBIDO ======
// Cuando alguien abre el HTML desde WhatsApp/Instagram/Facebook en iPhone, la app
// usa un WebView interno (no Safari real) que bloquea casi todas las acciones
// de compartir. Detectamos esto y mostramos instrucciones para abrir en Safari.

const detectarWebViewEmbebido = () => {
  const ua = navigator.userAgent || '';
  const esIOS = /iPad|iPhone|iPod/.test(ua);
  if (!esIOS) {
    // En Android los WebView de WhatsApp/Instagram también restringen pero menos.
    // Solo nos enfocamos en iOS donde el problema es más grave.
    const esAndroidWebView = /; wv\)/.test(ua);
    return { esWebView: esAndroidWebView, esIOS: false };
  }

  // En iOS, Safari real tiene "Safari" en el UA. Los WebViews embebidos NO lo tienen.
  // - Safari real: "Mozilla/5.0 ... Safari/605.1.15"
  // - WhatsApp WebView: "Mozilla/5.0 ... Mobile/15E148" (sin "Safari/")
  // - Instagram/FB: incluyen "Instagram" / "FBAN" / "FBAV" en el UA
  const tieneSafariReal = /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
  const esApp = /Instagram|FBAN|FBAV|FB_IAB|Line|MicroMessenger|WeChat/i.test(ua);
  const esWhatsAppWebView = esIOS && !tieneSafariReal && !/CriOS|FxiOS|EdgiOS/.test(ua);

  return {
    esWebView: esApp || esWhatsAppWebView,
    esIOS: true,
    esWhatsApp: esWhatsAppWebView && !esApp,
  };
};

const WEBVIEW_INFO = detectarWebViewEmbebido();

// ====== INSTALACIÓN COMO APP (PWA) ======
// Android Chrome dispara 'beforeinstallprompt' que nos permite mostrar un
// botón "Instalar" propio. iOS Safari NO soporta esta API: hay que mostrar
// instrucciones manuales (Compartir → Agregar a Pantalla de inicio).
let promptInstalacion = null;
let yaInstalada = false;
const detectarInstalacion = () => {
  // Chequeo si la app ya corre en modo standalone (instalada)
  const ua = navigator.userAgent || '';
  const standaloneDM = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  const standaloneIOS = window.navigator && window.navigator.standalone === true;
  yaInstalada = !!(standaloneDM || standaloneIOS);
  // Si veníamos desde URL con ?installed=1 (típico tras instalación) también lo marcamos
  if (/[?&]installed=1/.test(window.location.search)) yaInstalada = true;
};
detectarInstalacion();

const plataformaInstalacion = () => {
  const ua = navigator.userAgent || '';
  const esIOS = /iPad|iPhone|iPod/.test(ua);
  const esAndroid = /Android/.test(ua);
  const esSafariReal = esIOS && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
  const esChromeAndroid = esAndroid && /Chrome\//.test(ua) && !/EdgA\/|OPR\//.test(ua);
  return { esIOS, esAndroid, esSafariReal, esChromeAndroid };
};

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  promptInstalacion = e;
  // Si el usuario está mirando la pestaña Compartir, refrescamos para mostrar el botón
  if (typeof render === 'function' && tabActiva === 'amigos') render();
});

window.addEventListener('appinstalled', () => {
  promptInstalacion = null;
  yaInstalada = true;
  if (typeof render === 'function') render();
});

const ejecutarPromptInstalacion = async () => {
  if (!promptInstalacion) {
    alert('Tu navegador todavía no permite la instalación automática.\n\nAbrí la app en Chrome (Android) o Safari (iPhone) y volvé a intentar. En iPhone, usá el botón Compartir del navegador → "Agregar a Pantalla de inicio".');
    return;
  }
  try {
    promptInstalacion.prompt();
    const res = await promptInstalacion.userChoice;
    promptInstalacion = null;
    if (res && res.outcome === 'accepted') {
      yaInstalada = true;
    }
    render();
  } catch (e) {
    promptInstalacion = null;
    render();
  }
};

// ====== CONTROL DE VERSIÓN Y ACTUALIZACIONES ======
// La versión que se ve en el footer y se compara con la del SW para detectar
// si hay una versión nueva descargada esperando aplicarse.
const APP_VERSION = '1.9.8';
const APP_BUILD = '2026-05-18';
const STORAGE_KEY_UPDATE_DISMISS = 'album-mundial-2026-update-dismiss';

// ====== SINCRONIZACIÓN POR QR ======
// El emisor genera un QR con un deep link a la app + su código de amigo.
// El receptor escanea el QR con la cámara del celular (la app de cámara
// nativa de iOS/Android decodifica QRs y abre URLs automáticamente).
// La app al cargar detecta el ?import=... en la URL y le ofrece al
// receptor agregar al emisor como amigo de una.

let modalQRVisible = false;
let modalQRData = null;

const generarUrlSync = () => {
  const codigo = codificarEstado(miNombre || 'amigo', marcadas, repetidas);
  // Para evitar QRs gigantes cuando la app fue abierta desde un archivo
  // local, hardcodeamos el dominio público.
  const base = (location.protocol === 'http:' || location.protocol === 'https:')
    ? location.origin + location.pathname.replace(/[^/]*$/, '')
    : 'https://rundes.github.io/Mundial2026/';
  return base + '?import=' + encodeURIComponent(codigo);
};

const mostrarQRSync = () => {
  const nombre = (miNombre || '').trim();
  if (!nombre) {
    alert('Antes de generar el QR, escribí tu nombre en el campo "Tu nombre" más abajo.');
    return;
  }
  const url = generarUrlSync();
  let svgQR = null;
  for (const ec of ['M', 'L']) {
    try {
      const qr = qrcode(0, ec);
      qr.addData(url);
      qr.make();
      svgQR = qr.createSvgTag({ scalable: true, margin: 2 });
      break;
    } catch (e) {
      svgQR = null;
    }
  }
  if (!svgQR) {
    alert('Tu álbum tiene demasiados datos para entrar en un QR.\n\nUsá la opción "Copiar código" más abajo y mandáselo por WhatsApp como texto.');
    return;
  }
  modalQRData = { svg: svgQR, nombre, url };
  modalQRVisible = true;
  render();
};

const cerrarModalQR = () => {
  modalQRVisible = false;
  modalQRData = null;
  render();
};

const importarAmigoDesdeURL = () => {
  try {
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get('import');
    if (!codigo) return;
    // Limpiamos la URL antes para que un refresh no re-dispare la importación
    history.replaceState(null, '', window.location.pathname + window.location.hash);
    const data = decodificarEstado(codigo);
    if (!data) {
      setTimeout(() => alert('El código del QR no es válido o está incompleto. Pediles a tus papás o a quien lo generó que hagan uno nuevo.'), 200);
      return;
    }
    const yaExiste = data.nombre in amigos;
    const msg = yaExiste
      ? `Ya tenías a "${data.nombre}" guardado. ¿Querés actualizar su álbum con los datos nuevos?`
      : `¿Querés agregar a "${data.nombre}" a tus amigos?\n\nSe va a guardar su álbum para ver qué pueden intercambiar.`;
    setTimeout(() => {
      if (!confirm(msg)) return;
      if (!yaExiste && Object.keys(amigos).length >= MAX_AMIGOS) {
        alert(`Ya tenés ${MAX_AMIGOS} amigos guardados (el máximo). Borrá alguno antes de agregar otro.`);
        return;
      }
      amigos[data.nombre] = {
        marcadas: [...data.tengo],
        repetidas: data.repes,
        fecha: Date.now(),
      };
      guardar();
      chequearLogros();
      tabActiva = 'amigos';
      if (storage) try { storage.setItem(STORAGE_KEY_TAB, tabActiva); } catch (e) {}
      render();
      setTimeout(() => alert(`✅ Listo: "${data.nombre}" agregado a tus amigos.`), 80);
    }, 200);
  } catch (e) {}
};

let actualizacionDisponible = false; // hay un SW "waiting" listo para reemplazar al actual
let swRegistration = null;
let updateBannerDismissed = false;
try { updateBannerDismissed = sessionStorage.getItem(STORAGE_KEY_UPDATE_DISMISS) === '1'; } catch (e) {}

const aplicarActualizacion = () => {
  if (!swRegistration || !swRegistration.waiting) {
    // Sin SW disponible, recargamos directo (modo fallback)
    location.reload();
    return;
  }
  // Le pedimos al SW nuevo que tome el control. Cuando lo haga, el evento
  // 'controllerchange' va a disparar y recargamos la página para que se vea.
  swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' });
};

const descartarBannerActualizacion = () => {
  updateBannerDismissed = true;
  try { sessionStorage.setItem(STORAGE_KEY_UPDATE_DISMISS, '1'); } catch (e) {}
  if (typeof render === 'function') render();
};

const detectarUpdateEnReg = (reg) => {
  if (!reg) return;
  // Si ya hay uno esperando, marcamos al toque
  if (reg.waiting && navigator.serviceWorker.controller) {
    actualizacionDisponible = true;
    if (typeof render === 'function') render();
  }
  reg.addEventListener('updatefound', () => {
    const nuevoSW = reg.installing;
    if (!nuevoSW) return;
    nuevoSW.addEventListener('statechange', () => {
      if (nuevoSW.state === 'installed' && navigator.serviceWorker.controller) {
        actualizacionDisponible = true;
        updateBannerDismissed = false;
        try { sessionStorage.removeItem(STORAGE_KEY_UPDATE_DISMISS); } catch (e) {}
        if (typeof render === 'function') render();
      }
    });
  });
};

// Registramos el service worker (solo en http/https — file:// falla silenciosamente,
// lo cual es OK porque la app es self-contained).
if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      swRegistration = reg;
      detectarUpdateEnReg(reg);
      // Chequeamos updates cada 30 minutos mientras la pestaña esté abierta
      setInterval(() => { try { reg.update(); } catch (e) {} }, 30 * 60 * 1000);
    }).catch(() => {});

    // Si el controlador cambia (SW nuevo tomó el control) recargamos para
    // que la página corra con el código nuevo.
    let recargando = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recargando) return;
      recargando = true;
      location.reload();
    });

    // Cuando la pestaña vuelve al foreground, chequeamos updates
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && swRegistration) {
        try { swRegistration.update(); } catch (e) {}
      }
    });
  });
}

const FIGURITAS = 20;
const FWC_TOTAL = 19;
const CC_TOTAL = 14;
const TIENE_DOBLE_CERO = true;
const TOTAL_FIGURITAS = 48 * FIGURITAS + FWC_TOTAL + CC_TOTAL + (TIENE_DOBLE_CERO ? 1 : 0); // 994

// ID interno para la figurita "00" del álbum (portada / página inicial).
// La ponemos al FINAL del orden canónico para no romper compatibilidad con
// códigos AM26 generados por versiones anteriores (993 bits → siguen siendo
// válidos; el último bit nuevo simplemente arranca en false).
const DOBLE_CERO_ID = 'DC';

const ORDEN_FIGURITAS = (() => {
  const lista = [];
  Object.values(GRUPOS).flat().forEach(eq => {
    for (let i = 1; i <= FIGURITAS; i++) lista.push(`${eq.code}${i}`);
  });
  for (let i = 1; i <= FWC_TOTAL; i++) lista.push(`FWC${i}`);
  for (let i = 1; i <= CC_TOTAL; i++) lista.push(`CC${i}`);
  if (TIENE_DOBLE_CERO) lista.push(DOBLE_CERO_ID);
  return lista;
})();

// ====== HELPERS UTF-8 SEGUROS (reemplazan escape/unescape obsoletos) ======
const utf8aB64 = (str) => {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
};
const b64aUtf8 = (b64) => {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
};

  if (storage) {

const necesitaBackup = () => {
  if (backupReminderDismissed) return false;
  if (marcadas.size === 0 && Object.keys(repetidas).length === 0) return false;
  const semana = 7 * 24 * 3600 * 1000;
  if (ultimoBackupTs === 0 && cambiosDesdeBackup >= 15) return true;
  if (cambiosDesdeBackup >= 60) return true;
  if (ultimoBackupTs > 0 && Date.now() - ultimoBackupTs > semana && cambiosDesdeBackup >= 5) return true;
  return false;
};

};

const todosLosEquipos = Object.values(GRUPOS).flat();

// ====== CODIFICACIÓN COMPACTA ======
// Genera un string compacto con el estado del álbum.
// Formato: AM26:<nombre>:<base64-tengo>:<base64-repes>
// tengo: cadena de 0/1 (993 bits) → comprimida a base64
// repes: lista de pares "id:cantidad" separados por coma, comprimida

const codificarEstado = (nombre, tengo, repes) => {
  // bitmap de marcadas según ORDEN_FIGURITAS
  const bits = ORDEN_FIGURITAS.map(id => tengo.has(id) ? '1' : '0').join('');
  // pack en bytes
  const bytes = [];
  for (let i = 0; i < bits.length; i += 8) {
    bytes.push(parseInt(bits.slice(i, i + 8).padEnd(8, '0'), 2));
  }
  // a base64
  const tengoB64 = btoa(String.fromCharCode(...bytes));

  // repes: solo las que tienen cantidad > 0
  const repesPares = Object.entries(repes)
    .filter(([_, c]) => c > 0)
    .map(([id, c]) => `${id}.${c}`)
    .join(',');

  const nombreSafe = (nombre || 'amigo').replace(/[:|]/g, ' ').slice(0, 30);
  return `AM26|${nombreSafe}|${tengoB64}|${repesPares}`;
};

const decodificarEstado = (codigo) => {
  try {
    if (!codigo || typeof codigo !== 'string') return null;
    if (codigo.length > MAX_LEN_CODIGO) return null;
    // Si el usuario pegó el mensaje completo de WhatsApp (con saludo y todo),
    // extraemos solo la parte del código. El formato es:
    //   AM26|<nombre sin |>|<base64>|<repes opcional>
    // El nombre puede tener espacios y acentos pero NO pipes.
    // La b64 usa letras/dígitos/+///=. Los repes usan letras/dígitos/./, .
    if (!codigo.startsWith('AM26|')) {
      const m = codigo.match(/AM26\|[^|\n\r]{0,30}\|[A-Za-z0-9+/=]+(?:\|[A-Z0-9.,]*)?/);
      if (!m) return null;
      codigo = m[0];
    }
    const partes = codigo.trim().split('|');
    if (partes.length < 3) return null;
    const nombre = partes[1] || 'amigo';
    const tengoB64 = partes[2] || '';
    const repesStr = partes[3] || '';

    // decodificar bitmap
    const binStr = atob(tengoB64);
    const bytes = [];
    for (let i = 0; i < binStr.length; i++) bytes.push(binStr.charCodeAt(i));
    let bits = bytes.map(b => b.toString(2).padStart(8, '0')).join('');
    bits = bits.slice(0, ORDEN_FIGURITAS.length);
    const tengo = new Set();
    for (let i = 0; i < bits.length; i++) {
      if (bits[i] === '1') tengo.add(ORDEN_FIGURITAS[i]);
    }

    // decodificar repes
    const repes = {};
    if (repesStr) {
      repesStr.split(',').forEach(par => {
        const [id, cStr] = par.split('.');
        const c = parseInt(cStr, 10);
        if (id && c > 0) repes[id] = c;
      });
    }

    return { nombre, tengo, repes };
  } catch (e) {
    return null;
  }
};

const diasHasta = (fecha) => {
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const obj = new Date(fecha);
  obj.setHours(0, 0, 0, 0);
  return Math.round((obj - hoy) / (24 * 60 * 60 * 1000));
};

// Badge de progreso por equipo: cuanto más cerca de completar, más calor.
const getBadgeEquipo = (faltan, total) => {
  if (faltan === 0) return { emoji: '🏆', label: 'Completo', cls: 'bg-emerald-100 text-emerald-700' };
  if (faltan <= 2)  return { emoji: '🔥', label: faltan === 1 ? 'A 1 paso' : 'A 2 pasos', cls: 'bg-red-100 text-red-700' };
  if (faltan <= 5)  return { emoji: '⚡', label: 'Casi', cls: 'bg-amber-100 text-amber-700' };
  if (faltan <= 12) return { emoji: '🌱', label: 'A medias', cls: 'bg-blue-50 text-blue-700' };
  if (faltan < total) return { emoji: '❄️', label: 'Recién', cls: 'bg-gray-100 text-gray-600' };
  return { emoji: '🆕', label: 'Sin abrir', cls: 'bg-gray-100 text-gray-500' };
};

const statsEquipo = (code) => {
  let t = 0;
  for (let i = 1; i <= FIGURITAS; i++) if (marcadas.has(`${code}${i}`)) t++;
  return { tienen: t, total: FIGURITAS, faltan: FIGURITAS - t };
};

const repesEquipo = (code) => {
  let total = 0;
  const lista = [];
  for (let i = 1; i <= FIGURITAS; i++) {
    const c = repetidas[`${code}${i}`] || 0;
    if (c > 0) {
      total += c;
      lista.push({ n: i, cant: c });
    }
  }
  return { total, lista };
};

const faltantesEquipo = (code) => {
  const f = [];

};

// Calcula coincidencias con un amigo
const calcularMatch = (amigoData) => {
  // Yo tengo repe → amigo no tiene → "le doy"
  // Yo no tengo → amigo tiene repe → "me da"
  const leDoy = []; // {id, cant}
  const meDa = [];  // {id}

  ORDEN_FIGURITAS.forEach(id => {
    const tengoRepe = (repetidas[id] || 0) > 0;
    const amigoLaTiene = amigoData.tengo.has(id);
    const amigoTieneRepe = (amigoData.repes[id] || 0) > 0;

    if (tengoRepe && !amigoLaTiene) {
      leDoy.push({ id, cant: repetidas[id] });
    }
    if (!marcadas.has(id) && amigoTieneRepe) {
      meDa.push({ id, cant: amigoData.repes[id] });
    }
  });

  return { leDoy, meDa };
};

// ====== BACKUP / RESTORE ======
// El backup se guarda en formato .txt para que se pueda compartir por WhatsApp.
// WhatsApp NO permite enviar .json desde el celular pero sí .txt.
// El archivo arranca con un encabezado legible (resumen) y al final lleva
// un bloque BACKUP-INICIO/BACKUP-FIN con los datos codificados en base64.

const MARCA_INICIO = '===== BACKUP-INICIO =====';
const MARCA_FIN = '===== BACKUP-FIN =====';

const generarTextoBackup = () => {
  const stats = calcStats();
  const datos = {
    version: 3,
    fecha: new Date().toISOString(),
    nombre: miNombre,
    marcadas: [...marcadas],
    repetidas: repetidas,
    amigos: amigos,
  };

  // Codificamos en base64 UTF-8 seguro para que el texto pegado no se rompa
  // con caracteres especiales (acentos, emojis en el nombre, etc.)
  const jsonStr = JSON.stringify(datos);
  let payload;
  try {
    payload = utf8aB64(jsonStr);
  } catch (e) {
    try { payload = btoa(jsonStr); } catch (e2) { payload = ''; }
  }

  const fechaLegible = new Date().toLocaleString('es-AR');
  const cantAmigos = Object.keys(amigos).length;

  let txt = `📋 BACKUP - Mi Álbum Mundial 2026\n`;
  txt += `━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  txt += `Nombre: ${miNombre || '(sin nombre)'}\n`;
  txt += `Fecha del backup: ${fechaLegible}\n\n`;
  txt += `Resumen:\n`;
  txt += `• Figuritas pegadas: ${stats.tienen} de ${stats.total}\n`;
  txt += `• Repetidas: ${stats.totalRepes}\n`;
  txt += `• Amigos guardados: ${cantAmigos}\n`;
  txt += `• Completo: ${stats.pct}%\n\n`;
  txt += `━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  txt += `⚠️ NO BORRES NI MODIFIQUES EL CÓDIGO DE ABAJO\n`;
  txt += `Es necesario para restaurar tu álbum.\n`;
  txt += `Para restaurar: abrí la app, andá a Compartir → Restaurar y pegá todo este mensaje.\n`;
  txt += `━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  txt += `${MARCA_INICIO}\n${payload}\n${MARCA_FIN}\n`;

  return txt;
};

const parsearTextoBackup = (texto) => {
  if (!texto || typeof texto !== 'string') return null;
  if (texto.length > MAX_LEN_TEXTO_BACKUP) return null;
  const iStart = texto.indexOf(MARCA_INICIO);
  const iEnd = texto.indexOf(MARCA_FIN);
  if (iStart === -1 || iEnd === -1 || iEnd < iStart) return null;
  const payload = texto.substring(iStart + MARCA_INICIO.length, iEnd).trim();
  if (!payload || payload.length > MAX_LEN_TEXTO_BACKUP) return null;
  try {
    let jsonStr;
    try {
      jsonStr = b64aUtf8(payload);
    } catch (e) {
      try { jsonStr = atob(payload); } catch (e2) { return null; }
    }
    return JSON.parse(jsonStr);
  } catch (e) {
    return null;
  }
};

const aplicarBackup = (datos) => {
  if (!datos || typeof datos !== 'object') {
    alert('❌ El backup no es válido.');
    return false;
  }
  const tieneMarcadas = Array.isArray(datos.marcadas);
  const tieneRepes = datos.repetidas && typeof datos.repetidas === 'object';
  if (!tieneMarcadas && !tieneRepes) {
    alert('❌ El backup no tiene datos válidos.');
    return false;
  }

  const cuantasMarcadas = tieneMarcadas ? datos.marcadas.length : 0;
  const cuantasRepes = tieneRepes ? Object.keys(datos.repetidas).length : 0;
  const cuantosAmigos = datos.amigos ? Object.keys(datos.amigos).length : 0;

  const msg = `¿Restaurar este backup?\n\n` +
    `Nombre: ${datos.nombre || '(sin nombre)'}\n` +
    `Figuritas: ${cuantasMarcadas}\n` +
    `Repetidas: ${cuantasRepes}\n` +
    `Amigos: ${cuantosAmigos}\n\n` +
    `⚠️ Esto va a reemplazar todo lo que tenés cargado ahora.`;

  if (!confirm(msg)) return false;

  if (tieneMarcadas) {
    // Filtramos solo IDs válidos para evitar inyectar basura desde un backup adulterado
    const validos = new Set(ORDEN_FIGURITAS);
    marcadas = new Set(datos.marcadas.filter(id => typeof id === 'string' && validos.has(id)));
  }
  if (tieneRepes) {
    const validos = new Set(ORDEN_FIGURITAS);
    const limpio = {};
    Object.entries(datos.repetidas).forEach(([id, c]) => {
      const n = parseInt(c, 10);
      if (validos.has(id) && Number.isFinite(n) && n > 0 && n < 1000) limpio[id] = n;
    });
    repetidas = limpio;
  }
  if (typeof datos.nombre === 'string') miNombre = datos.nombre.slice(0, 30);
  if (datos.amigos && typeof datos.amigos === 'object') {
    // Limitamos cantidad de amigos para evitar bloating
    const entradas = Object.entries(datos.amigos).slice(0, MAX_AMIGOS);
    const limpio = {};
    entradas.forEach(([nombre, a]) => {
      if (typeof nombre !== 'string' || !a || typeof a !== 'object') return;
      const validos = new Set(ORDEN_FIGURITAS);
      const m = Array.isArray(a.marcadas) ? a.marcadas.filter(id => typeof id === 'string' && validos.has(id)) : [];
      const r = {};
      if (a.repetidas && typeof a.repetidas === 'object') {
        Object.entries(a.repetidas).forEach(([id, c]) => {
          const n = parseInt(c, 10);
          if (validos.has(id) && Number.isFinite(n) && n > 0 && n < 1000) r[id] = n;
        });
      }
      limpio[nombre.slice(0, 30)] = { marcadas: m, repetidas: r, fecha: typeof a.fecha === 'number' ? a.fecha : Date.now() };
    });
    amigos = limpio;
  }

  marcarBackupHecho();
  guardar();
  chequearLogros();
  render();
  alert('✅ Backup restaurado con éxito');
  return true;
};

const descargarBackup = () => {
  const txt = generarTextoBackup();
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0, 10);
  const safeName = (miNombre || 'album').replace(/[^a-zA-Z0-9]/g, '_') || 'album';
  a.href = url;
  a.download = `Album-Mundial-2026_${safeName}_${fecha}.txt`;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  marcarBackupHecho();
  render();
};

// Compartir backup vía Web Share API (con archivo .txt) o WhatsApp (texto)
const compartirBackupWpp = () => {
  const txt = generarTextoBackup();

  // El backup es muy largo. La mejor estrategia en iOS es:
  // 1) Si Web Share API soporta files, usarla (se procesa internamente sin
  //    bloqueo de popup porque es navigator.share nativo).
  // 2) Si no, abrir WhatsApp DIRECTAMENTE con el texto (sincrónico).
  try {
    const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
    const fecha = new Date().toISOString().slice(0, 10);
    const safeName = (miNombre || 'album').replace(/[^a-zA-Z0-9]/g, '_') || 'album';
    const fileName = `Album-Mundial-2026_${safeName}_${fecha}.txt`;
    const file = new File([blob], fileName, { type: 'text/plain' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      // navigator.share es la única forma confiable de compartir archivos
      // desde móvil. iOS Safari la soporta desde iOS 15.
      navigator.share({
        files: [file],
        title: 'Backup Álbum Mundial 2026',
        text: 'Backup de mi álbum del Mundial 2026.',
      }).then(() => {
        marcarBackupHecho();
        render();
      }).catch((err) => {
        if (err && err.name === 'AbortError') return;
        // Si el usuario cancela o falla, mandamos el backup como texto
        compartirWhatsApp(txt);
        marcarBackupHecho();
        render();
      });
      return;
    }
  } catch (err) {
    // si falla, caemos al fallback
  }

  // Fallback: enviamos el backup completo como texto de WhatsApp
  // (igual queda guardado en el chat, que es lo que importa)
  compartirWhatsApp(txt);
  marcarBackupHecho();
  render();
};

const restaurarBackupDesdeArchivo = (file) => {
  if (!file) return;
  if (file.size > MAX_BYTES_ARCHIVO_BACKUP) {
    alert('❌ El archivo es demasiado grande (máximo 5 MB). No parece un backup válido de esta app.');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const contenido = e.target.result;
    if (typeof contenido !== 'string' || contenido.length > MAX_LEN_TEXTO_BACKUP) {
      alert('❌ El archivo es demasiado grande para procesarlo.');
      return;
    }
    const datos = parsearTextoBackup(contenido);
    if (datos) {
      aplicarBackup(datos);
      return;
    }
    // Compatibilidad: backups viejos en formato JSON puro
    try {
      const datosJson = JSON.parse(contenido);
      aplicarBackup(datosJson);
    } catch (err) {
      alert('❌ No se pudo leer el archivo.\n\nAsegurate de que sea un backup generado por esta app (archivo .txt que arranca con "📋 BACKUP - Mi Álbum Mundial 2026").');
    }
  };
  reader.onerror = () => alert('❌ Hubo un problema al leer el archivo.');
  reader.readAsText(file);
};

const restaurarBackupDesdeTexto = (texto) => {
  if (!texto || !texto.trim()) {
    alert('Pegá el contenido del backup antes de restaurar.');
    return;
  }
  if (texto.length > MAX_LEN_TEXTO_BACKUP) {
    alert('❌ El texto es demasiado grande para procesarlo.');
    return;
  }
  const datos = parsearTextoBackup(texto);
  if (datos) {
    aplicarBackup(datos);
    return;
  }
  // Por si pegaron solo el JSON
  try {
    const datosJson = JSON.parse(texto);
    aplicarBackup(datosJson);
  } catch (err) {
    alert('❌ No reconocí ese contenido como un backup válido.\n\nAsegurate de copiar el mensaje completo, incluyendo las líneas BACKUP-INICIO y BACKUP-FIN.');
  }
};

// Snapshot del HTML LIMPIO de la app, sin datos del usuario. Se captura una
// sola vez antes del primer render para que al compartir nunca filtremos
// el nombre, el código personal, las marcas o los amigos.
let HTML_LIMPIO_SNAPSHOT = null;
const tomarSnapshotLimpio = () => {
  try {
    // Clonamos documentElement y sobre el clon vaciamos #app para no filtrar
    // datos del usuario. Dejamos #boot para que el receptor vea un loader.
    const clon = document.documentElement.cloneNode(true);
    const appEl = clon.querySelector('#app');
    if (appEl) appEl.innerHTML = '';
    HTML_LIMPIO_SNAPSHOT = '<!DOCTYPE html>\n' + clon.outerHTML;
  } catch (e) {
    HTML_LIMPIO_SNAPSHOT = null;
  }
};

const obtenerHtmlLimpio = () => {
  // Si por algún motivo no tenemos snapshot, hacemos uno on-the-fly.
  if (!HTML_LIMPIO_SNAPSHOT) tomarSnapshotLimpio();
  return HTML_LIMPIO_SNAPSHOT || ('<!DOCTYPE html>\n' + document.documentElement.outerHTML);
};

// ====== PARSER COMPATIBLE CON OTRAS APPS ======
// Detecta y parsea un mensaje de la app Figuri (figuri.app), donde los
// usuarios comparten la lista de "Me faltan" / "Repetidas" en formato
// texto plano. Devuelve { marcadas, repetidas } calculando lo que tiene
// el amigo (= todas las del álbum menos las faltantes).
const esMensajeFiguri = (texto) => {
  if (!texto || typeof texto !== 'string') return false;
  return /figuri\.app|Figuri|Me faltan \(\d|Repetidas \(\d/i.test(texto);
};

const parseFiguriMessage = (texto) => {
  if (!esMensajeFiguri(texto)) return null;

  const teamCodes = new Set(todosLosEquipos.map(eq => eq.code));
  const faltantes = new Set();
  const repes = {};
  let faltaDobleCero = false;
  let dobleCeroRepe = 0;
  let seccion = 'none'; // 'faltantes' | 'repes' | 'none'

  const lineas = texto.split(/\r?\n/);
  for (const lineaRaw of lineas) {
    const linea = lineaRaw.trim();
    if (!linea) continue;

    // Cambio de sección (encabezados típicos de Figuri)
    if (/Me faltan|faltantes|❌/i.test(linea)) { seccion = 'faltantes'; continue; }
    if (/Repetidas|Repes|🔄/i.test(linea) && /\(\d+\)/.test(linea)) { seccion = 'repes'; continue; }

    // "Special: 00" → doble cero
    const specialMatch = linea.match(/^Special\s*:\s*0?0(?:\b|$)/i);
    if (specialMatch) {
      if (seccion === 'faltantes') faltaDobleCero = true;
      else if (seccion === 'repes') dobleCeroRepe++;
      continue;
    }

    // Líneas de FWC: "Tournament (FWC): 1, 2, 3" / "Host Countries and Cities (FWC): 6, 7, 8" / etc.
    const fwcMatch = linea.match(/\(FWC\)\s*:\s*(.+)$/i);
    if (fwcMatch) {
      const items = fwcMatch[1].split(',').map(s => s.trim());
      items.forEach(item => {
        const m = item.match(/^(\d+)(?:\s*\(?\s*x\s*(\d+)\s*\)?)?/i);
        if (!m) return;
        const num = parseInt(m[1], 10);
        const qty = m[2] ? parseInt(m[2], 10) : 1;
        if (!Number.isFinite(num) || num < 1 || num > FWC_TOTAL) return;
        const id = `FWC${num}`;
        if (seccion === 'faltantes') faltantes.add(id);
        else if (seccion === 'repes') repes[id] = (repes[id] || 0) + qty;
      });
      continue;
    }

    // Líneas de CC (Coca-Cola): "(CC): 1, 2, 3"
    const ccMatch = linea.match(/\(CC\)\s*:\s*(.+)$/i);
    if (ccMatch) {
      const items = ccMatch[1].split(',').map(s => s.trim());
      items.forEach(item => {
        const m = item.match(/^(\d+)(?:\s*\(?\s*x\s*(\d+)\s*\)?)?/i);
        if (!m) return;
        const num = parseInt(m[1], 10);
        const qty = m[2] ? parseInt(m[2], 10) : 1;
        if (!Number.isFinite(num) || num < 1 || num > CC_TOTAL) return;
        const id = `CC${num}`;
        if (seccion === 'faltantes') faltantes.add(id);
        else if (seccion === 'repes') repes[id] = (repes[id] || 0) + qty;
      });
      continue;
    }

    // Líneas de equipo: "🇲🇽 MEX: 1, 2, 3, 4, 5" o "MEX: 1 (x2), 3"
    const teamMatch = linea.match(/(?:^|\s)([A-Z]{3})\s*:\s*(.+)$/);
    if (teamMatch) {
      const code = teamMatch[1];
      if (!teamCodes.has(code)) continue;
      const items = teamMatch[2].split(',').map(s => s.trim());
      items.forEach(item => {
        const m = item.match(/^(\d+)(?:\s*\(?\s*x\s*(\d+)\s*\)?)?/i);
        if (!m) return;
        const num = parseInt(m[1], 10);
        const qty = m[2] ? parseInt(m[2], 10) : 1;
        if (!Number.isFinite(num) || num < 1 || num > FIGURITAS) return;
        const id = `${code}${num}`;
        if (seccion === 'faltantes') faltantes.add(id);
        else if (seccion === 'repes') repes[id] = (repes[id] || 0) + qty;
      });
      continue;
    }
  }

  // Si no parseamos nada útil, no es un mensaje válido
  if (faltantes.size === 0 && !faltaDobleCero && dobleCeroRepe === 0 && Object.keys(repes).length === 0) {
    return null;
  }

  // Calculamos qué tiene el amigo = TODAS las del álbum menos las que le faltan.
  // Si solo había sección "repes" sin "faltantes", asumimos que tiene todas las
  // que no están en la sección de repes (no es correcto pero es lo mejor que
  // podemos inferir).
  const marcadas = new Set();
  ORDEN_FIGURITAS.forEach(id => {
    if (id === DOBLE_CERO_ID) {
      if (!faltaDobleCero) marcadas.add(id);
    } else {
      if (!faltantes.has(id)) marcadas.add(id);
    }
  });

  if (dobleCeroRepe > 0) repes[DOBLE_CERO_ID] = dobleCeroRepe;

  return { marcadas, repetidas: repes };
};

const importarAmigo = (codigo) => {
  const data = decodificarEstado(codigo);

  if (data) {
    // Flujo original AM26
    if (!(data.nombre in amigos) && Object.keys(amigos).length >= MAX_AMIGOS) {
      alert(`Ya tenés ${MAX_AMIGOS} amigos guardados (el máximo). Borrá alguno antes de agregar otro.`);
      return;
    }
    amigos[data.nombre] = {
      marcadas: [...data.tengo],
      repetidas: data.repes,
      fecha: Date.now(),
    };
    guardar();
    chequearLogros();
    render();
    return;
  }

  // Si no era AM26, probamos formato Figuri
  if (esMensajeFiguri(codigo)) {
    const figData = parseFiguriMessage(codigo);
    if (!figData) {
      alert('No pude leer ese mensaje de Figuri. Asegurate de pegarlo completo, desde "Me faltan" hasta el final.');
      return;
    }
    const tienen = figData.marcadas.size;
    const totalRepes = Object.values(figData.repetidas).reduce((s, c) => s + c, 0);
    const ok = confirm(
      `📋 Detectamos un mensaje de Figuri.\n\n` +
      `📊 Tu amigo tiene ${tienen} de ${TOTAL_FIGURITAS} figuritas.\n` +
      (totalRepes ? `🔄 Repetidas: ${totalRepes}\n` : '') +
      `\n¿Querés agregarlo a tu lista de amigos?`
    );
    if (!ok) return;
    const nombre = window.prompt('Figuri no incluye el nombre del que comparte.\n\n¿Cómo se llama tu amigo? (para identificarlo en tu lista)', '');
    if (!nombre || !nombre.trim()) return;
    const nombreSafe = nombre.trim().replace(/[:|]/g, ' ').slice(0, 30);
    if (!(nombreSafe in amigos) && Object.keys(amigos).length >= MAX_AMIGOS) {
      alert(`Ya tenés ${MAX_AMIGOS} amigos guardados (el máximo). Borrá alguno antes de agregar otro.`);
      return;
    }
    amigos[nombreSafe] = {
      marcadas: [...figData.marcadas],
      repetidas: figData.repetidas,
      fecha: Date.now(),
    };
    guardar();
    chequearLogros();
    render();
    setTimeout(() => alert(`✅ Listo: "${nombreSafe}" agregado desde Figuri.`), 80);
    return;
  }

  alert('No pudimos leer ese mensaje.\n\nAceptamos:\n• Códigos AM26 de esta app (empiezan con AM26|)\n• Mensajes de Figuri (figuri.app)');
};

// Fallback con link directo:
// - En MOBILE (Android/iOS, sea PWA standalone o navegador común):
//   protocolo `whatsapp://send?text=...` directo al sistema operativo.
//   Saltamos wa.me a propósito por dos razones:
//   1) En PWA standalone, wa.me dentro del WebView termina mostrando
//      "Descargar WhatsApp" aunque el usuario lo tenga instalado.
//   2) Para mensajes largos (lista completa de faltantes + link
//      AM26), wa.me corrompe el encoding al hacer el redirect a
//      api.whatsapp.com/send — los emojis terminan apareciendo como
//      `�` (REPLACEMENT CHARACTER). Saltándolo evitamos esto.
//   Asumimos que el usuario tiene WhatsApp instalado (es la premisa
//   de la app); si no, el OS muestra un toast genérico.
// - En DESKTOP: wa.me con target=_blank, que abre WhatsApp Web.
const _compartirWhatsAppFallback = (texto) => {
  const encoded = encodeURIComponent(texto);
  const ua = (navigator && navigator.userAgent) || '';
  const esMobile = /Android|iPhone|iPad|iPod/i.test(ua);

  const href = esMobile
    ? `whatsapp://send?text=${encoded}`
    : `https://wa.me/?text=${encoded}`;

  const a = document.createElement('a');
  a.href = href;
  // target=_blank solo para wa.me (HTTPS). Para whatsapp:// no
  // queremos abrir un tab nuevo porque el OS hace el handoff.
  if (!esMobile) a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    if (a.parentNode) a.parentNode.removeChild(a);
  }, 100);
};

const compartirWhatsApp = (texto) => {
  // Si estamos dentro de un WebView embebido (como el de WhatsApp en iPhone),
  // no podemos abrir WhatsApp desde ahí. Copiamos al portapapeles y avisamos.
  if (WEBVIEW_INFO.esWebView) {
    let copiado = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = texto;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.contentEditable = 'true';
      ta.readOnly = false;
      const range = document.createRange();
      range.selectNodeContents(ta);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ta.setSelectionRange(0, 999999);
      copiado = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) {}

    if (copiado) {
      alert('📋 El mensaje se copió al portapapeles.\n\nAbrí WhatsApp, elegí el contacto y pegá el mensaje (manteniendo apretado en el cuadro de texto).\n\n💡 Para que estos botones funcionen automáticamente, abrí la app en Safari (los tres puntos arriba → "Abrir en Safari").');
    } else {
      window.prompt('Tocá y mantené apretado el texto para copiarlo, después pegalo en WhatsApp:', texto);
    }
    return;
  }

  // Preferimos Web Share API cuando está disponible. Esto es CRÍTICO en
  // PWA standalone (Android Chrome instalado, iOS "Agregar a inicio"):
  // ahí no hay tab del navegador para defer-ear el wa.me y el <a
  // target="_blank"> termina abriendo wa.me dentro de la propia PWA
  // sin pasar el control al sistema, así que nunca llega a la app
  // nativa de WhatsApp para elegir contacto.
  //
  // navigator.share() abre el sheet nativo del OS, el usuario elige
  // WhatsApp (o Telegram, o lo que tenga) y el mensaje se manda con la
  // selección de contacto del propio WhatsApp. Funciona idéntico en
  // browser y en PWA instalada.
  if (typeof navigator !== 'undefined' && typeof navigator.share === 'function') {
    try {
      const p = navigator.share({ text: texto });
      if (p && typeof p.then === 'function') {
        p.catch((err) => {
          // AbortError = el usuario canceló el sheet a propósito. No
          // hacemos fallback porque sería molesto reabrir wa.me.
          if (err && (err.name === 'AbortError' || /abort|cancel/i.test(err.message || ''))) return;
          // Cualquier otro error: caemos al método clásico.
          _compartirWhatsAppFallback(texto);
        });
      }
      return;
    } catch (e) {
      // Si tira sincrónico (algunos browsers viejos), seguimos al fallback.
    }
  }

  _compartirWhatsAppFallback(texto);
};

const copiarTexto = async (texto) => {
  // Safari/iOS requiere que esto se ejecute en un handler de evento síncrono.
  // Probamos navigator.clipboard primero (requiere https o file://),
  // y caemos a execCommand si falla.
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(texto);
      return true;
    }
  } catch (e) {
    // sigue al fallback
  }
  // Fallback con textarea
  try {
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    ta.style.pointerEvents = 'none';
    document.body.appendChild(ta);
    // iOS necesita selección explícita
    ta.contentEditable = 'true';
    ta.readOnly = false;
    const range = document.createRange();
    range.selectNodeContents(ta);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    ta.setSelectionRange(0, 999999);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e2) {
    return false;
  }
};

// ====== ACORTADOR DE URL ======
// Usamos cleanuri.com (free, sin API key, con CORS habilitado). is.gd no
// sirve desde browser porque no manda Access-Control-Allow-Origin.
// La contra: cleanuri guarda el link largo en sus servidores. Como nuestro
// link incluye el código AM26 con nombre + figuritas marcadas, eso queda
// en sus logs. Lo aclaramos en "Sobre la app".
//
// Estrategia: pre-acortamos en background cuando el usuario abre la
// pestaña Compartir y cacheamos. Cuando hace click en "Compartir", si
// el cache no está listo, abrimos un placeholder window y esperamos.
let _shortUrlCache = null;
let _lastLongUrl = null;
let _shorteningInFlight = false;

const acortarUrl = async (longUrl) => {
  if (longUrl === _lastLongUrl && _shortUrlCache) return _shortUrlCache;
  _lastLongUrl = longUrl;
  _shortUrlCache = null;
  _shorteningInFlight = true;
  try {
    const r = await fetch('https://cleanuri.com/api/v1/shorten', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'url=' + encodeURIComponent(longUrl),
    });
    if (r && r.ok) {
      const data = await r.json();
      if (data && typeof data.result_url === 'string' && data.result_url.startsWith('http')) {
        _shortUrlCache = data.result_url;
      }
    }
  } catch (e) {}
  _shorteningInFlight = false;
  return _shortUrlCache || longUrl;
};

const obtenerShortUrlCacheado = (longUrl) => {
  if (longUrl === _lastLongUrl && _shortUrlCache) return _shortUrlCache;
  return longUrl;
};

const precalcularShortUrl = () => {
  if (!miNombre || !miNombre.trim()) return;
  const longUrl = generarUrlSync();
  if (longUrl === _lastLongUrl && _shortUrlCache) return;
  if (_shorteningInFlight) return;
  acortarUrl(longUrl).catch(() => {});
};

const compartirAlbumPorLink = () => {
  const nombre = (miNombre || '').trim();
  if (!nombre) {
    alert('Antes escribí tu nombre arriba (Paso 1 · "¿Cómo te llamás?").');
    return;
  }
  const longUrl = generarUrlSync();
  const cached = obtenerShortUrlCacheado(longUrl);

  // Caso 1: ya tenemos el short en cache → todo sincrónico
  if (cached !== longUrl) {
    const txt = construirMensajeAlbum(cached);
    compartirWhatsApp(txt);
    return;
  }

  // Caso 2: no hay cache. En WebView o en cualquier mobile (Android/iOS),
  // NO usamos el hack de ventana placeholder. Razones:
  // - El placeholder se usaba para mantener el gesto del usuario y poder
  //   navegar a wa.me con el shortener resuelto. Pero en mobile compartirWhatsApp
  //   ahora usa `whatsapp://send?text=...` (protocolo custom, no requiere
  //   tab nueva), así que el placeholder es innecesario.
  // - Peor aún: el hack terminaba navegando esa ventana a wa.me, que para
  //   mensajes largos corrompe los emojis al hacer el redirect a
  //   api.whatsapp.com/send (aparecen como `�`).
  // Esperamos el shortener inline (con timeout corto por si la API se
  // cuelga) y mandamos por compartirWhatsApp.
  const ua = (navigator && navigator.userAgent) || '';
  const esMobileShare = /Android|iPhone|iPad|iPod/i.test(ua);
  if (WEBVIEW_INFO.esWebView || esMobileShare) {
    Promise.race([
      acortarUrl(longUrl),
      new Promise((resolve) => setTimeout(() => resolve(longUrl), 2000)),
    ]).then((url) => {
      const txt = construirMensajeAlbum(url);
      compartirWhatsApp(txt);
    });
    return;
  }

  // Caso 3 (desktop): no hay cache, abrimos una ventana placeholder DENTRO
  // del gesto del usuario y la redirigimos a wa.me cuando llega el short URL.
  let win = null;
  try { win = window.open('about:blank', '_blank'); } catch (e) {}

  if (!win) {
    // El navegador bloqueó la ventana. Mandamos con URL larga al toque
    // (no perdemos el gesto). El shortener queda corriendo en background
    // para la próxima vez.
    acortarUrl(longUrl).catch(() => {});
    const txt = construirMensajeAlbum(longUrl);
    compartirWhatsApp(txt);
    return;
  }

  // Pantalla de "preparando..." en la ventana abierta
  try {
    win.document.write('<!doctype html><html><head><title>Preparando link...</title><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#444;background:#f8f8f8;text-align:center;padding:20px"><div><div style="font-size:24px;margin-bottom:8px">⚽</div><div>Preparando link corto…</div></div></body></html>');
  } catch (e) {}

  acortarUrl(longUrl)
    .then((url) => {
      const txt = construirMensajeAlbum(url);
      const waUrl = 'https://wa.me/?text=' + encodeURIComponent(txt);
      try { win.location.href = waUrl; }
      catch (e) { try { win.close(); } catch (e2) {} compartirWhatsApp(txt); }
    })
    .catch(() => {
      const txt = construirMensajeAlbum(longUrl);
      const waUrl = 'https://wa.me/?text=' + encodeURIComponent(txt);
      try { win.location.href = waUrl; }
      catch (e) { try { win.close(); } catch (e2) {} compartirWhatsApp(txt); }
    });
};

      ta.style.left = '0';

// Las banderas son caracteres Unicode estándar (no son material protegido).
const FLAGS = {
  MEX: '🇲🇽', RSA: '🇿🇦', KOR: '🇰🇷', CZE: '🇨🇿',
  CAN: '🇨🇦', BIH: '🇧🇦', QAT: '🇶🇦', SUI: '🇨🇭',

  USA: '🇺🇸', PAR: '🇵🇾', AUS: '🇦🇺', TUR: '🇹🇷',
  GER: '🇩🇪', CUW: '🇨🇼', CIV: '🇨🇮', ECU: '🇪🇨',
  NED: '🇳🇱', JPN: '🇯🇵', SWE: '🇸🇪', TUN: '🇹🇳',
  BEL: '🇧🇪', EGY: '🇪🇬', IRN: '🇮🇷', NZL: '🇳🇿',
  ESP: '🇪🇸', CPV: '🇨🇻', KSA: '🇸🇦', URU: '🇺🇾',
  FRA: '🇫🇷', SEN: '🇸🇳', IRQ: '🇮🇶', NOR: '🇳🇴',
  ARG: '🇦🇷', ALG: '🇩🇿', AUT: '🇦🇹', JOR: '🇯🇴',
  POR: '🇵🇹', COD: '🇨🇩', UZB: '🇺🇿', COL: '🇨🇴',
  ENG: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', CRO: '🇭🇷', GHA: '🇬🇭', PAN: '🇵🇦',
};
const flagOf = (code) => FLAGS[code] || '⚽';

// Convierte un emoji bandera en su secuencia de codepoints hex (sin selectores
// de variación). Ej: "🇦🇷" → "1f1e6-1f1f7". Usado para construir URLs Twemoji.
const codepointsDeFlag = (emoji) => {
  const cps = [];
  let i = 0;
  while (i < emoji.length) {
    const cp = emoji.codePointAt(i);
    cps.push(cp.toString(16));
    i += cp > 0xFFFF ? 2 : 1;
  }
  return cps.filter(c => c !== 'fe0f').join('-');
};

// Bandera para usar en HTML. En iOS/Android/Mac los emojis Unicode de banderas
// se ven bien nativamente. Pero Chrome en Windows no tiene glifos de banderas
// (Microsoft omitió las banderas de país en Segoe UI Emoji). Para que se vean
// en todas las plataformas, renderizamos un <img> de Twemoji (MIT/CC-BY 4.0)
// vía jsDelivr. Si falla la carga (offline en el primer acceso), el alt text
// muestra el emoji nativo (que el SO renderiza como puede).
const flagHtml = (code) => {
  const emoji = FLAGS[code] || '⚽';
  const cps = codepointsDeFlag(emoji);
  return `<img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@v15.1.0/assets/svg/${cps}.svg" alt="${emoji}" class="inline-block align-[-0.15em] w-[1.1em] h-[1.1em] shrink-0" loading="lazy" decoding="async">`;
};

  for (let i = 1; i <= CC_TOTAL; i++) if (!marcadas.has(`CC${i}`)) ccF.push(i);
  const faltaDobleCero = TIENE_DOBLE_CERO && !marcadas.has(DOBLE_CERO_ID);

  if (fwcF.length > 0 || ccF.length > 0 || faltaDobleCero) {
    txt += `▸ Especiales\n`;
    if (faltaDobleCero) txt += `✨ Doble cero (00 · la brillosita de la tapa)\n`;
    if (fwcF.length > 0) txt += `🏆 FWC (estadios, mascota, trofeo, pelota): ${fwcF.join(', ')}\n`;
    if (ccF.length > 0) txt += `🥤 CC (canje Coca-Cola con tapitas): ${ccF.join(', ')}\n`;
    txt += `\n`;
  }

  // ===== SECCIÓN 2: REPETIDAS PARA INTERCAMBIAR =====
  if (totalRepes > 0) {
    txt += `━━━━━━━━━━━━━━━━━━━━\n`;
    txt += `🔄 REPETIDAS QUE TENGO\n`;
    txt += `para intercambiar 🤝\n`;
    txt += `━━━━━━━━━━━━━━━━━━━━\n\n`;

    for (const [letra, equipos] of Object.entries(GRUPOS)) {
      let bloque = '';
      equipos.forEach(eq => {
        const r = repesEquipo(eq.code);
        if (r.lista.length > 0) {
          const items = r.lista.map(x => x.cant > 1 ? `${x.n}(x${x.cant})` : `${x.n}`).join(', ');
          bloque += `${flagOf(eq.code)} ${eq.nombre}: ${items}\n`;
        }
      });
      if (bloque) txt += `▸ Grupo ${letra}\n${bloque}\n`;
    }

    const fwcR = [];
    for (let i = 1; i <= FWC_TOTAL; i++) {
      const c = repetidas[`FWC${i}`] || 0;
      if (c > 0) fwcR.push(c > 1 ? `${i}(x${c})` : `${i}`);
    }
    const ccR = [];
    for (let i = 1; i <= CC_TOTAL; i++) {
      const c = repetidas[`CC${i}`] || 0;
      if (c > 0) ccR.push(c > 1 ? `${i}(x${c})` : `${i}`);
    }
    const dcRepe = TIENE_DOBLE_CERO ? (repetidas[DOBLE_CERO_ID] || 0) : 0;
    if (fwcR.length > 0 || ccR.length > 0 || dcRepe > 0) {
      txt += `▸ Especiales\n`;
      if (dcRepe > 0) txt += `✨ Doble cero (00 · la brillosita de la tapa)${dcRepe > 1 ? ` (x${dcRepe})` : ''}\n`;
      if (fwcR.length > 0) txt += `🏆 FWC: ${fwcR.join(', ')}\n`;
      if (ccR.length > 0) txt += `🥤 CC: ${ccR.join(', ')}\n`;
      txt += `\n`;
    }

    txt += `Si tenés alguna de las que me faltan y te sirve alguna de mis repes, ¡avisame! 🙌`;
  } else {
    txt += `Todavía no tengo repetidas para cambiar. Si conseguís alguna de las que me faltan, ¡te lo súper agradezco! 🙏`;
  }

  compartirWhatsApp(txt);
};

const escapeAttr = (s) => String(s).replace(/"/g, '&quot;').replace(/'/g, "&#39;");
const escapeHtml = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// (no para FWC, CC o doble cero que son estadios/trofeo/portada).

  !!id && !id.startsWith('FWC') && !id.startsWith('CC') && id !== DOBLE_CERO_ID && /^[A-Z]{3}\d+$/.test(id);

// ====== BÚSQUEDA / FILTRO DE EQUIPOS Y SECCIONES ======
// Normaliza el texto para matchear: lowercase + saca acentos (combining marks).
const normalizarBusqueda = (s) => (s || '').toString().toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

// Match permisivo de un grupo: "a", "A", "grupo A", "g a", "grupo-a"…
const grupoCoincide = (letra, qNorm) => {
  if (!qNorm) return true;
  const l = letra.toLowerCase();
  return qNorm === l || qNorm === `grupo ${l}` || qNorm === `g ${l}` ||
         qNorm === `grupo${l}` || qNorm === `g${l}`;
};

// Match de sección especial: FWC / CC / 00.
const especialCoincide = (tag, qNorm) => {
  if (!qNorm) return true;
  if (qNorm.includes('especial')) return true;
  if (tag === 'fwc') return qNorm.includes('fwc') || qNorm.includes('mascota') || qNorm.includes('trofeo') || qNorm.includes('estadio');
  if (tag === 'cc')  return qNorm.includes('cc')  || qNorm.includes('coca');
  if (tag === '00')  return qNorm.includes('00')  || qNorm.includes('doble cero') || qNorm.includes('tapa') || qNorm.includes('holo') || qNorm.includes('brillo');
  return false;
};

// Aplica el filtro al DOM ya renderizado (no re-renderiza). Recorre los
// data-team-card / data-group-section / data-special-section del tab activo
// y muestra/oculta. Si nada coincide muestra el bloque "sin resultados".
const aplicarBusqueda = (modo) => {
  const raw = modo === 'tengo' ? busquedaTengo : busquedaRepes;
  const q = normalizarBusqueda(raw);
  const root = document.getElementById('app');
  if (!root) return;

  let totalVisibles = 0;

  root.querySelectorAll(`[data-group-section="${modo}"]`).forEach(section => {
    const letra = section.dataset.groupLetter || '';
    const matchGrupo = grupoCoincide(letra, q);
    let visiblesEnGrupo = 0;
    section.querySelectorAll('[data-team-card]').forEach(card => {
      const nombre = normalizarBusqueda(card.dataset.teamName || '');
      const code = (card.dataset.teamCode || '').toLowerCase();
      const matchEquipo = !q || matchGrupo || nombre.includes(q) || code.includes(q);
      card.style.display = matchEquipo ? '' : 'none';
      if (matchEquipo) visiblesEnGrupo++;
    });
    section.style.display = visiblesEnGrupo > 0 ? '' : 'none';
    totalVisibles += visiblesEnGrupo;
  });

  root.querySelectorAll(`[data-special-section="${modo}"]`).forEach(section => {
    const tag = section.dataset.specialTag || '';
    const matchEsp = especialCoincide(tag, q);
    section.style.display = matchEsp ? '' : 'none';
    if (matchEsp) totalVisibles++;
  });

  const empty = document.getElementById(`busqueda-vacia-${modo}`);
  if (empty) empty.style.display = (q && totalVisibles === 0) ? '' : 'none';
};

// muestra a través del botón X visible (no del color del borde,

const renderBusquedaVacia = (modo) => `<div id="busqueda-vacia-${modo}" style="display:none" class="bg-gray-50 border border-gray-200 rounded-2xl p-8 text-center mb-8">

const renderTabTengo = () => {
  let grupos = '';
  for (const [letra, equipos] of Object.entries(GRUPOS)) {
    let eqHtml = '';
    equipos.forEach(eq => eqHtml += renderEquipoTengo(eq));
    grupos += `<div data-group-section="tengo" data-group-letter="${letra}" class="mb-8">

const renderTipWidget = () => {

  const lista = getEquiposNecesitanAmor(3);

  const cards = lista.map(({ eq, faltan }) => {
    return `<div class="bg-white border border-rose-200 rounded-xl p-3 flex items-center gap-3">
      <div class="text-3xl shrink-0 flex items-center justify-center w-10 h-10">${flagHtml(eq.code)}</div>
      <div class="min-w-0 flex-1">
        <div class="font-bold text-gray-900 text-sm leading-tight truncate">${eq.nombre}</div>

    </div>`;

  return `<div class="bg-gradient-to-br from-rose-50 to-pink-50 border-2 border-rose-200 rounded-2xl p-4 ${sinMb ? '' : 'mb-6'}">

    <div class="space-y-2">${cards}</div>
  </div>`;
};

// Carrusel auto-rotante entre "Casi están" y "Necesitan amor".
// Si solo hay datos en uno de los dos, mostramos ese sin carrusel.
const renderCarruselMejorPeor = () => {
  const masCerca = getEquiposMasCerca(3);
  const necesitanAmor = getEquiposNecesitanAmor(3);

  if (masCerca.length === 0 && necesitanAmor.length === 0) return '';
  if (masCerca.length === 0) return renderNecesitanAmorWidget();
  if (necesitanAmor.length === 0) return renderMasCercaWidget();

  const activo = carruselSlide === 0 ? renderMasCercaWidget(true) : renderNecesitanAmorWidget(true);
  return `<div class="mb-6">
    <div role="region" aria-roledescription="carrusel" aria-label="Equipos casi listos y equipos que necesitan más figuritas">
      ${activo}
    </div>
    <div class="flex justify-center items-center gap-2 mt-3">
      <button data-action="carrusel-slide" data-idx="0" aria-label="Casi están" aria-current="${carruselSlide === 0 ? 'true' : 'false'}" class="h-1.5 rounded-full transition-all ${carruselSlide === 0 ? 'w-6 bg-gray-900' : 'w-1.5 bg-gray-300'}"></button>
      <button data-action="carrusel-slide" data-idx="1" aria-label="Necesitan amor" aria-current="${carruselSlide === 1 ? 'true' : 'false'}" class="h-1.5 rounded-full transition-all ${carruselSlide === 1 ? 'w-6 bg-gray-900' : 'w-1.5 bg-gray-300'}"></button>

};

const renderToastLogro = () => {

const renderModalLogros = () => {
  if (!modalLogrosVisible) return '';
  const desbloqueados = LOGROS.filter(l => logrosDesbloqueados[l.id]);
  const bloqueados = LOGROS.filter(l => !logrosDesbloqueados[l.id]);
  const renderItem = (l, esto) => `
    <div class="flex items-center gap-3 p-3 rounded-xl ${esto ? 'bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200' : 'bg-gray-50 border border-gray-200'}">
      <div class="text-3xl ${esto ? '' : 'grayscale opacity-40'} shrink-0">${l.emoji}</div>
      <div class="min-w-0 flex-1">
        <div class="font-bold text-sm leading-tight ${esto ? 'text-gray-900' : 'text-gray-500'}">${escapeHtml(l.titulo)}</div>
        <div class="text-xs leading-tight mt-0.5 ${esto ? 'text-gray-700' : 'text-gray-400'}">${escapeHtml(l.desc)}</div>
        ${esto && logrosDesbloqueados[l.id] ? `<div class="text-[10px] text-amber-700 mt-1">🗓️ ${new Date(logrosDesbloqueados[l.id]).toLocaleDateString('es-AR')}</div>` : ''}
      </div>
    </div>`;
  return `<div class="fixed inset-0 z-50 bg-black/80 flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto" data-action="cerrar-logros">

      <div class="flex items-center justify-between mb-3">
        <div>

          <div class="text-2xl font-bold tracking-tight text-gray-900">Tus logros</div>
          <div class="text-xs text-gray-500 mt-0.5">${desbloqueados.length} de ${LOGROS.length} desbloqueados</div>
        </div>
        <button data-action="cerrar-logros" class="text-2xl text-gray-400 active:text-gray-700 leading-none px-2">×</button>
      </div>
      <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden mb-4">
        <div class="h-full bg-gradient-to-r from-amber-400 to-orange-500" style="width: ${Math.round(desbloqueados.length * 100 / LOGROS.length)}%"></div>
      </div>
      ${desbloqueados.length > 0 ? `
        <div class="text-[10px] font-bold tracking-wider text-amber-700 uppercase mb-2">🏆 Conseguidos</div>
        <div class="space-y-2 mb-4">${desbloqueados.map(l => renderItem(l, true)).join('')}</div>
      ` : ''}
      ${bloqueados.length > 0 ? `
        <div class="text-[10px] font-bold tracking-wider text-gray-500 uppercase mb-2">🔒 Te faltan</div>
        <div class="space-y-2">${bloqueados.map(l => renderItem(l, false)).join('')}</div>
      ` : ''}
    </div>
  </div>`;
};

// Eventos
document.addEventListener('click', (e) => {
  // Tap directo sobre un overlay de modal/sheet (no sobre un hijo) → cerrar.
  // Detectamos por dataset.action y verificamos que el target sea el overlay
  // mismo, no un descendiente del card.
  if (e.target && e.target.dataset && e.target.dataset.action) {
    const overlayAction = e.target.dataset.action;
    if (overlayAction === 'cerrar-fab') { cerrarFabSheet(); return; }
    if (overlayAction === 'cerrar-qr') { cerrarModalQR(); return; }
    if (overlayAction === 'cerrar-logros') { cerrarModalLogros(); return; }
    if (overlayAction === 'noop') return; // click adentro del card, fuera de cualquier botón
  }
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'toggle') toggle(btn.dataset.id);
  else if (action === 'sumar-repe') sumarRepe(btn.dataset.id);
  else if (action === 'restar-repe') restarRepe(btn.dataset.id);
  else if (action === 'marcar-equipo') marcarEquipo(btn.dataset.code);
  else if (action === 'reset') resetTodo();
  else if (action === 'copiar-url') {
    const url = window.location.href;
    // Si es file:// no tiene sentido copiar, mostramos instrucciones
    if (url.startsWith('file:') || url.startsWith('blob:')) {
      window.prompt('Esta app está guardada como archivo en tu celular. Tocá los tres puntos (•••) arriba y elegí "Abrir en Safari" para usarla bien.', 'Abrí desde Archivos > Safari');
      return;
    }
    try {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.contentEditable = 'true';
      ta.readOnly = false;
      const range = document.createRange();
      range.selectNodeContents(ta);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ta.setSelectionRange(0, 999999);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) {
        alert('✅ Dirección copiada.\n\nAhora abrí Safari y pegala en la barra de direcciones.');
      } else {
        window.prompt('Copiá esta dirección y pegala en Safari:', url);
      }
    } catch (e) {
      window.prompt('Copiá esta dirección y pegala en Safari:', url);
    }
  }
  else if (action === 'tab') cambiarTab(btn.dataset.tab);
  else if (action === 'limpiar-busqueda') {
    const modo = btn.dataset.modo;
    if (modo === 'tengo') busquedaTengo = ''; else if (modo === 'repes') busquedaRepes = '';
    const inp = document.getElementById(`buscador-${modo}`);
    if (inp) { inp.value = ''; try { inp.focus(); } catch (e) {} }
    aplicarBusqueda(modo);
    const btnX = document.getElementById(`limpiar-busqueda-${modo}`);
    if (btnX) btnX.style.display = 'none';
  }
  else if (action === 'compartir-album-link') {
    // Capturamos el nombre sin re-renderizar (Safari iOS exige handler síncrono)
    const inp = document.getElementById('input-nombre');
    if (inp) {
      miNombre = (inp.value || '').trim().slice(0, 30);
      try { localStorage.setItem(STORAGE_KEY_NOMBRE, miNombre); } catch (e) {}
    }
    compartirAlbumPorLink();
  }
  else if (action === 'copiar-link-album') {
    const inp = document.getElementById('input-nombre');
    if (inp) {
      miNombre = (inp.value || '').trim().slice(0, 30);
      try { localStorage.setItem(STORAGE_KEY_NOMBRE, miNombre); } catch (e) {}
    }
    copiarLinkAlbum();
  }
  else if (action === 'compartir-codigo-wpp') {
    // Capturamos el nombre sin re-renderizar (un render reemplaza el DOM
    // y Safari iOS pierde el contexto del click, bloqueando la apertura)
    const inp = document.getElementById('input-nombre');
    if (inp) {
      miNombre = (inp.value || '').trim().slice(0, 30);
      try { localStorage.setItem(STORAGE_KEY_NOMBRE, miNombre); } catch (e) {}
    }
    compartirCodigo();
  }
  else if (action === 'copiar-codigo') {
    const inp = document.getElementById('input-nombre');
    if (inp) {
      miNombre = (inp.value || '').trim().slice(0, 30);
      try { localStorage.setItem(STORAGE_KEY_NOMBRE, miNombre); } catch (e) {}
    }
    compartirSoloCodigo();
  }
  else if (action === 'importar-amigo') {
    const inp = document.getElementById('input-codigo-amigo');
    if (inp) {
      importarAmigo(inp.value);
      inp.value = '';
    }
  }
  else if (action === 'borrar-amigo') borrarAmigo(btn.dataset.nombre);
  else if (action === 'pedir-actualizacion') pedirActualizacion(btn.dataset.nombre);
  else if (action === 'match-wpp') {
    const nombre = btn.dataset.nombre;
    const a = amigos[nombre];
    if (a) {
      const amigoData = { tengo: new Set(a.marcadas), repes: a.repetidas || {} };
      const match = calcularMatch(amigoData);
      compartirMatchPorWpp(nombre, match);
    }
  }
  else if (action === 'compartir-app') compartirApp();
  else if (action === 'descargar-app') descargarApp();
  else if (action === 'compartir-link-app') compartirLinkApp();
  else if (action === 'descargar-backup') descargarBackup();
  else if (action === 'compartir-backup-wpp') compartirBackupWpp();
  else if (action === 'abrir-restaurar-texto') {
    const bloque = document.getElementById('bloque-restaurar-texto');
    if (bloque) {
      bloque.classList.remove('hidden');
      const ta = document.getElementById('input-restore-texto');
      if (ta) setTimeout(() => ta.focus(), 50);
    }
  }
  else if (action === 'cancelar-restaurar-texto') {
    const bloque = document.getElementById('bloque-restaurar-texto');
    if (bloque) bloque.classList.add('hidden');
    const ta = document.getElementById('input-restore-texto');
    if (ta) ta.value = '';
  }
  else if (action === 'restaurar-desde-texto') {
    const ta = document.getElementById('input-restore-texto');
    if (ta) restaurarBackupDesdeTexto(ta.value);
  }
  else if (action === 'compartir-lista') compartirListaCompleta();
  else if (action === 'pedir-equipo') compartirEquipoEspecifico(btn.dataset.code);
  else if (action === 'abrir-logros') abrirModalLogros();
  else if (action === 'cerrar-logros') cerrarModalLogros();
  else if (action === 'dismiss-tip') descartarTipHoy();
  else if (action === 'abrir-fab') abrirFabSheet();
  else if (action === 'cerrar-fab') cerrarFabSheet();
  else if (action === 'fab-lista-completa') { fabSheetOpen = false; compartirListaCompleta(); render(); }
  else if (action === 'fab-solo-faltantes') compartirSoloFaltantes();
  else if (action === 'fab-solo-repes') compartirSoloRepes();
  else if (action === 'fab-mostrar-qr') {
    fabSheetOpen = false;
    // mostrarQRSync requiere nombre. Si no hay, le pedimos al usuario ir a la pestaña Compartir.
    if (!miNombre || !miNombre.trim()) {
      alert('Antes de generar el QR, andá a la pestaña Compartir y escribí tu nombre en "Paso 1 · ¿Cómo te llamás?"');
      tabActiva = 'amigos';
      if (storage) try { storage.setItem(STORAGE_KEY_TAB, tabActiva); } catch(e) {}
      render();
      return;
    }
    mostrarQRSync();
  }
  else if (action === 'fab-link-app') { fabSheetOpen = false; compartirLinkApp(); render(); }
  else if (action === 'carrusel-slide') {
    const idx = parseInt(btn.dataset.idx, 10);
    if (idx === 0 || idx === 1) cambiarSlideCarrusel(idx);
  }
  else if (action === 'dismiss-backup') descartarRecordatorioBackup();
  else if (action === 'instalar-app') ejecutarPromptInstalacion();
  else if (action === 'aplicar-update') aplicarActualizacion();
  else if (action === 'dismiss-update') descartarBannerActualizacion();
  else if (action === 'buscar-update') buscarActualizacionAhora();
  else if (action === 'mostrar-qr') {
    // Capturamos el nombre del input sin re-render previo (mismo motivo
    // que en compartir-codigo-wpp: Safari iOS necesita el handler sincrónico).
    const inp = document.getElementById('input-nombre');
    if (inp) {
      miNombre = (inp.value || '').trim().slice(0, 30);
      if (storage) try { storage.setItem(STORAGE_KEY_NOMBRE, miNombre); } catch (e) {}
    }
    mostrarQRSync();
  }
  else if (action === 'cerrar-qr') cerrarModalQR();
  else if (action === 'qr-compartir-wpp') {
    if (modalQRData) {
      const txt = `⚽ ¡Hola! Te paso mi álbum del Mundial 2026 (de ${modalQRData.nombre}).\n\nAbrí este link y se te carga directo:\n${modalQRData.url}`;
      compartirWhatsApp(txt);
    }
  }
});

const buscarActualizacionAhora = () => {
  if (!swRegistration) {
    alert('Esta versión de la app no puede chequear actualizaciones automáticamente.\n\nPara obtener la última, abrí https://rundes.github.io/Mundial2026/ en tu navegador y refrescá la página (mantené apretado el botón de recargar y elegí "Recargar sin caché" si está disponible).');
    return;
  }
  swRegistration.update().then(() => {
    setTimeout(() => {
      if (!actualizacionDisponible) {
        alert('✅ Ya estás en la última versión (v' + APP_VERSION + ').');
      }
    }, 400);
  }).catch(() => {
    alert('No se pudo chequear ahora. Probá de nuevo cuando tengas conexión.');
  });
};

// Listener para el input file de restore (delegado, una sola vez)
document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'input-restore') {
    const file = e.target.files && e.target.files[0];
    if (file) {
      restaurarBackupDesdeArchivo(file);
      e.target.value = '';
    }
  }
});

// Tomamos un snapshot LIMPIO del HTML antes de inyectar cualquier dato del
// usuario. Esto es lo que vamos a compartir cuando le pasemos la app a un amigo.
// Si lo hacemos después de render(), el HTML quedaría con el nombre, código y
// figuritas marcadas del usuario actual (¡fuga de datos!).
tomarSnapshotLimpio();

render();

// Chequeamos logros sobre los datos cargados desde localStorage. Si el usuario
// venía con figuritas, repes o amigos cargados de antes y todavía no se le
// marcaron los logros correspondientes (ej. tras una restauración de backup),
// acá los reconciliamos y aparecen los toasts.
chequearLogros();

// Si el usuario abre la app en la pestaña Compartir, pre-acortamos el link
// en background para que el botón "Mandar por WhatsApp" lo use cacheado.
if (tabActiva === 'amigos') precalcularShortUrl();

// Arrancamos el carrusel auto-rotante de "Casi están / Necesitan amor"
iniciarCarrusel();

// Si la app fue abierta con ?import=... (típicamente desde el escaneo de
// un QR de un familiar), ofrecemos importar ese amigo automáticamente.
importarAmigoDesdeURL();

// Sincronizamos cambios entre pestañas/ventanas abiertas del mismo navegador
window.addEventListener('storage', (e) => {
  if (!e.key || !e.key.startsWith('album-mundial-2026')) return;
  try {
    if (storage) {
      const t = storage.getItem(STORAGE_KEY_TENGO);
      marcadas = t ? new Set(JSON.parse(t)) : new Set();
      const r = storage.getItem(STORAGE_KEY_REPES);
      repetidas = r ? JSON.parse(r) : {};
      const nm = storage.getItem(STORAGE_KEY_NOMBRE);
      miNombre = nm || '';
      const am = storage.getItem(STORAGE_KEY_AMIGOS);
      amigos = am ? JSON.parse(am) : {};
      cambiosDesdeBackup = parseInt(storage.getItem(STORAGE_KEY_BACKUP_CAMBIOS) || '0', 10) || 0;
      ultimoBackupTs = parseInt(storage.getItem(STORAGE_KEY_BACKUP_FECHA) || '0', 10) || 0;
      render();
    }
  } catch (err) {}
});
</script>
</body>
</html>
