// Cuando alguien abre el HTML desde WhatsApp/Instagram/Facebook en iPhone, la app
// usa un WebView interno (no Safari real) que bloquea casi todas las acciones
// de compartir. Detectamos esto y mostramos instrucciones para abrir en Safari.

const detectarWebViewEmbebido = () => {
  const ua = navigator.userAgent || '';
  const esIOS = /iPad|iPhone|iPod/.test(ua);
  if (!esIOS) {
    // En Android los WebView de WhatsApp/Instagram también restringen pero menos.
    // Solo nos enfocamos en iOS donde el problema es más grave.
    const esAndroidWebView = /; wv\)/.test(ua);
    return { esWebView: esAndroidWebView, esIOS: false };
  }

  // En iOS, Safari real tiene "Safari" en el UA. Los WebViews embebidos NO lo tienen.
  // - Safari real: "Mozilla/5.0 ... Safari/605.1.15"
  // - WhatsApp WebView: "Mozilla/5.0 ... Mobile/15E148" (sin "Safari/")
  // - Instagram/FB: incluyen "Instagram" / "FBAN" / "FBAV" en el UA
  const tieneSafariReal = /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
  const esApp = /Instagram|FBAN|FBAV|FB_IAB|Line|MicroMessenger|WeChat/i.test(ua);
  const esWhatsAppWebView = esIOS && !tieneSafariReal && !/CriOS|FxiOS|EdgiOS/.test(ua);

  return {
    esWebView: esApp || esWhatsAppWebView,
    esIOS: true,
    esWhatsApp: esWhatsAppWebView && !esApp,
  };
};

const FIGURITAS = 20;
const FWC_TOTAL = 19;
const CC_TOTAL = 14;

// Construyo el orden canónico de todas las figuritas para serializar/deserializar
const ORDEN_FIGURITAS = (() => {
  const lista = [];
  Object.values(GRUPOS).flat().forEach(eq => {

  for (let i = 1; i <= CC_TOTAL; i++) lista.push(`CC${i}`);
  return lista;
})();

const STORAGE_KEY_TENGO = 'album-mundial-2026';
const STORAGE_KEY_REPES = 'album-mundial-2026-repes';
const STORAGE_KEY_TAB = 'album-mundial-2026-tab';
const STORAGE_KEY_NOMBRE = 'album-mundial-2026-nombre';
const STORAGE_KEY_AMIGOS = 'album-mundial-2026-amigos';
const STORAGE_KEY_BACKUP_FECHA = 'album-mundial-2026-backup-fecha';
const STORAGE_KEY_BACKUP_CAMBIOS = 'album-mundial-2026-backup-cambios';
const STORAGE_KEY_BACKUP_DISMISS = 'album-mundial-2026-backup-dismiss';

const MAX_AMIGOS = 50;
const MAX_LEN_CODIGO = 100_000;
const MAX_LEN_TEXTO_BACKUP = 5_000_000;
const MAX_BYTES_ARCHIVO_BACKUP = 5_000_000;

// ====== HELPERS UTF-8 SEGUROS (reemplazan escape/unescape obsoletos) ======
const utf8aB64 = (str) => {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
};
const b64aUtf8 = (b64) => {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
};

let marcadas = new Set();
let repetidas = {};
let tabActiva = 'tengo';
let miNombre = '';
let amigos = {}; // { nombre: { marcadas: [...], repetidas: {...} } }
let cambiosDesdeBackup = 0;
let ultimoBackupTs = 0;
let backupReminderDismissed = false;

// Detectamos si localStorage está disponible (modo privado de Safari puede tirar excepción al escribir)
let storage = null;
try {
  const test = '__t__' + Math.random();
  localStorage.setItem(test, '1');
  localStorage.removeItem(test);
  storage = localStorage;
} catch (e) {
  try {
    // Fallback a sessionStorage si localStorage está bloqueado
    sessionStorage.setItem('__t__', '1');
    sessionStorage.removeItem('__t__');
    storage = sessionStorage;
  } catch (e2) {
    storage = null;
  }
}

try {
  if (storage) {
    const t = storage.getItem(STORAGE_KEY_TENGO);
    if (t) marcadas = new Set(JSON.parse(t));
    const r = storage.getItem(STORAGE_KEY_REPES);
    if (r) repetidas = JSON.parse(r);
    const tab = storage.getItem(STORAGE_KEY_TAB);
    if (tab) tabActiva = tab;
    const nm = storage.getItem(STORAGE_KEY_NOMBRE);
    if (nm) miNombre = nm;
    const am = storage.getItem(STORAGE_KEY_AMIGOS);
    if (am) amigos = JSON.parse(am);
    cambiosDesdeBackup = parseInt(storage.getItem(STORAGE_KEY_BACKUP_CAMBIOS) || '0', 10) || 0;
    ultimoBackupTs = parseInt(storage.getItem(STORAGE_KEY_BACKUP_FECHA) || '0', 10) || 0;
    backupReminderDismissed = storage.getItem(STORAGE_KEY_BACKUP_DISMISS) === '1';
  }
} catch (e) {}

let yaAvisamosCuotaLlena = false;

const guardar = () => {
  if (!storage) return;
  try {
    storage.setItem(STORAGE_KEY_TENGO, JSON.stringify([...marcadas]));
    storage.setItem(STORAGE_KEY_REPES, JSON.stringify(repetidas));
    storage.setItem(STORAGE_KEY_TAB, tabActiva);
    storage.setItem(STORAGE_KEY_NOMBRE, miNombre);
    storage.setItem(STORAGE_KEY_AMIGOS, JSON.stringify(amigos));
  } catch (e) {
    // QuotaExceededError u otros: avisamos solo una vez para no spammear
    if (!yaAvisamosCuotaLlena) {
      yaAvisamosCuotaLlena = true;
      setTimeout(() => alert('⚠️ No se pudo guardar tu progreso en este dispositivo.\n\nProbable causa: el navegador está en modo privado o se quedó sin espacio. Hacé un backup ya mismo (Compartir → Mandármelo por WhatsApp) para no perder los datos.'), 50);
    }
  }
};

const marcarCambio = () => {
  cambiosDesdeBackup++;
  backupReminderDismissed = false;
  if (storage) {
    try {
      storage.setItem(STORAGE_KEY_BACKUP_CAMBIOS, String(cambiosDesdeBackup));
      storage.removeItem(STORAGE_KEY_BACKUP_DISMISS);
    } catch (e) {}
  }
};

const marcarBackupHecho = () => {
  cambiosDesdeBackup = 0;
  ultimoBackupTs = Date.now();
  backupReminderDismissed = false;
  if (storage) {
    try {
      storage.setItem(STORAGE_KEY_BACKUP_CAMBIOS, '0');
      storage.setItem(STORAGE_KEY_BACKUP_FECHA, String(ultimoBackupTs));
      storage.removeItem(STORAGE_KEY_BACKUP_DISMISS);
    } catch (e) {}
  }
};

const necesitaBackup = () => {
  if (backupReminderDismissed) return false;
  if (marcadas.size === 0 && Object.keys(repetidas).length === 0) return false;
  const semana = 7 * 24 * 3600 * 1000;
  if (ultimoBackupTs === 0 && cambiosDesdeBackup >= 15) return true;
  if (cambiosDesdeBackup >= 60) return true;
  if (ultimoBackupTs > 0 && Date.now() - ultimoBackupTs > semana && cambiosDesdeBackup >= 5) return true;
  return false;
};

const descartarRecordatorioBackup = () => {
  backupReminderDismissed = true;

// ====== CODIFICACIÓN COMPACTA ======
// Genera un string compacto con el estado del álbum.
// Formato: AM26:<nombre>:<base64-tengo>:<base64-repes>
// tengo: cadena de 0/1 (993 bits) → comprimida a base64
// repes: lista de pares "id:cantidad" separados por coma, comprimida

const codificarEstado = (nombre, tengo, repes) => {
  // bitmap de marcadas según ORDEN_FIGURITAS
  const bits = ORDEN_FIGURITAS.map(id => tengo.has(id) ? '1' : '0').join('');
  // pack en bytes
  const bytes = [];
  for (let i = 0; i < bits.length; i += 8) {
    bytes.push(parseInt(bits.slice(i, i + 8).padEnd(8, '0'), 2));
  }
  // a base64
  const tengoB64 = btoa(String.fromCharCode(...bytes));

  // repes: solo las que tienen cantidad > 0
  const repesPares = Object.entries(repes)
    .filter(([_, c]) => c > 0)
    .map(([id, c]) => `${id}.${c}`)
    .join(',');

  const nombreSafe = (nombre || 'amigo').replace(/[:|]/g, ' ').slice(0, 30);
  return `AM26|${nombreSafe}|${tengoB64}|${repesPares}`;
};

const decodificarEstado = (codigo) => {
  try {
    if (!codigo || typeof codigo !== 'string') return null;
    if (codigo.length > MAX_LEN_CODIGO) return null;
    if (!codigo.startsWith('AM26|')) return null;
    const partes = codigo.trim().split('|');
    if (partes.length < 3) return null;
    const nombre = partes[1] || 'amigo';
    const tengoB64 = partes[2] || '';
    const repesStr = partes[3] || '';

    // decodificar bitmap
    const binStr = atob(tengoB64);
    const bytes = [];
    for (let i = 0; i < binStr.length; i++) bytes.push(binStr.charCodeAt(i));
    let bits = bytes.map(b => b.toString(2).padStart(8, '0')).join('');
    bits = bits.slice(0, ORDEN_FIGURITAS.length);
    const tengo = new Set();
    for (let i = 0; i < bits.length; i++) {
      if (bits[i] === '1') tengo.add(ORDEN_FIGURITAS[i]);
    }

    // decodificar repes
    const repes = {};
    if (repesStr) {
      repesStr.split(',').forEach(par => {
        const [id, cStr] = par.split('.');
        const c = parseInt(cStr, 10);
        if (id && c > 0) repes[id] = c;
      });
    }

    return { nombre, tengo, repes };
  } catch (e) {
    return null;
  }
};

// ====== CÁLCULOS ======

const calcStats = () => {
  const total = 48 * FIGURITAS + FWC_TOTAL + CC_TOTAL;
  const tienen = marcadas.size;
  let totalRepes = 0;
  Object.values(repetidas).forEach(c => totalRepes += c);
  return {
    tienen, total, faltan: total - tienen,
    pct: Math.round((tienen / total) * 100),
    totalRepes,
  };
};

const statsEquipo = (code) => {
  let t = 0;
  for (let i = 1; i <= FIGURITAS; i++) if (marcadas.has(`${code}${i}`)) t++;
  return { tienen: t, total: FIGURITAS, faltan: FIGURITAS - t };
};

const repesEquipo = (code) => {
  let total = 0;
  const lista = [];
  for (let i = 1; i <= FIGURITAS; i++) {
    const c = repetidas[`${code}${i}`] || 0;
    if (c > 0) {
      total += c;
      lista.push({ n: i, cant: c });
    }
  }
  return { total, lista };
};

const faltantesEquipo = (code) => {
  const f = [];
  for (let i = 1; i <= FIGURITAS; i++) if (!marcadas.has(`${code}${i}`)) f.push(i);
  return f;
};

// Calcula coincidencias con un amigo
const calcularMatch = (amigoData) => {
  // Yo tengo repe → amigo no tiene → "le doy"
  // Yo no tengo → amigo tiene repe → "me da"
  const leDoy = []; // {id, cant}
  const meDa = [];  // {id}

  ORDEN_FIGURITAS.forEach(id => {
    const tengoRepe = (repetidas[id] || 0) > 0;
    const amigoLaTiene = amigoData.tengo.has(id);
    const amigoTieneRepe = (amigoData.repes[id] || 0) > 0;

    if (tengoRepe && !amigoLaTiene) {
      leDoy.push({ id, cant: repetidas[id] });
    }
    if (!marcadas.has(id) && amigoTieneRepe) {
      meDa.push({ id, cant: amigoData.repes[id] });
    }
  });

  return { leDoy, meDa };
};

// ====== ACCIONES ======

const toggle = (id) => {
  if (marcadas.has(id)) marcadas.delete(id);
  else marcadas.add(id);
  marcarCambio();
  guardar();
  render();
};

const sumarRepe = (id) => {
  if (!marcadas.has(id)) marcadas.add(id);
  repetidas[id] = (repetidas[id] || 0) + 1;
  marcarCambio();
  guardar();
  render();
};

const restarRepe = (id) => {
  if (!repetidas[id]) return;
  repetidas[id]--;
  if (repetidas[id] <= 0) delete repetidas[id];
  marcarCambio();
  guardar();
  render();
};

const marcarEquipo = (code) => {
  let todas = true;
  for (let i = 1; i <= FIGURITAS; i++) if (!marcadas.has(`${code}${i}`)) { todas = false; break; }
  for (let i = 1; i <= FIGURITAS; i++) {
    if (todas) marcadas.delete(`${code}${i}`);
    else marcadas.add(`${code}${i}`);
  }
  marcarCambio();
  guardar();
  render();
};

const resetTodo = () => {
  const stats = calcStats();
  if (stats.tienen === 0 && stats.totalRepes === 0) {
    alert('Tu álbum ya está vacío.');
    return;
  }
  const msg = `¿Borrar todas las marcas y repetidas?\n\n` +
    `Vas a perder ${stats.tienen} figuritas y ${stats.totalRepes} repetidas.\n` +
    `Los amigos guardados se mantienen.\n\n` +
    `⚠️ Esta acción no se puede deshacer. Si todavía no hiciste un backup, cancelá y andá a Compartir → "Mandármelo por WhatsApp" primero.`;
  if (confirm(msg)) {
    marcadas = new Set();
    repetidas = {};
    marcarCambio();
    guardar();
    render();
  }
};

// ====== BACKUP / RESTORE ======
// El backup se guarda en formato .txt para que se pueda compartir por WhatsApp.
// WhatsApp NO permite enviar .json desde el celular pero sí .txt.
// El archivo arranca con un encabezado legible (resumen) y al final lleva
// un bloque BACKUP-INICIO/BACKUP-FIN con los datos codificados en base64.

const MARCA_INICIO = '===== BACKUP-INICIO =====';
const MARCA_FIN = '===== BACKUP-FIN =====';

const generarTextoBackup = () => {
  const stats = calcStats();
  const datos = {
    version: 3,
    fecha: new Date().toISOString(),
    nombre: miNombre,
    marcadas: [...marcadas],
    repetidas: repetidas,
    amigos: amigos,
  };

  // Codificamos en base64 UTF-8 seguro para que el texto pegado no se rompa
  // con caracteres especiales (acentos, emojis en el nombre, etc.)
  const jsonStr = JSON.stringify(datos);
  let payload;
  try {
    payload = utf8aB64(jsonStr);
  } catch (e) {
    try { payload = btoa(jsonStr); } catch (e2) { payload = ''; }
  }

  const fechaLegible = new Date().toLocaleString('es-AR');
  const cantAmigos = Object.keys(amigos).length;

  let txt = `📋 BACKUP - Mi Álbum Mundial 2026\n`;
  txt += `━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  txt += `Nombre: ${miNombre || '(sin nombre)'}\n`;
  txt += `Fecha del backup: ${fechaLegible}\n\n`;
  txt += `Resumen:\n`;
  txt += `• Figuritas pegadas: ${stats.tienen} de ${stats.total}\n`;
  txt += `• Repetidas: ${stats.totalRepes}\n`;
  txt += `• Amigos guardados: ${cantAmigos}\n`;
  txt += `• Completo: ${stats.pct}%\n\n`;
  txt += `━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  txt += `⚠️ NO BORRES NI MODIFIQUES EL CÓDIGO DE ABAJO\n`;
  txt += `Es necesario para restaurar tu álbum.\n`;
  txt += `Para restaurar: abrí la app, andá a Compartir → Restaurar y pegá todo este mensaje.\n`;
  txt += `━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  txt += `${MARCA_INICIO}\n${payload}\n${MARCA_FIN}\n`;

  return txt;
};

const parsearTextoBackup = (texto) => {
  if (!texto || typeof texto !== 'string') return null;
  if (texto.length > MAX_LEN_TEXTO_BACKUP) return null;
  const iStart = texto.indexOf(MARCA_INICIO);
  const iEnd = texto.indexOf(MARCA_FIN);
  if (iStart === -1 || iEnd === -1 || iEnd < iStart) return null;
  const payload = texto.substring(iStart + MARCA_INICIO.length, iEnd).trim();
  if (!payload || payload.length > MAX_LEN_TEXTO_BACKUP) return null;
  try {
    let jsonStr;
    try {
      jsonStr = b64aUtf8(payload);
    } catch (e) {
      try { jsonStr = atob(payload); } catch (e2) { return null; }
    }
    return JSON.parse(jsonStr);
  } catch (e) {
    return null;
  }
};

const aplicarBackup = (datos) => {
  if (!datos || typeof datos !== 'object') {
    alert('❌ El backup no es válido.');
    return false;
  }
  const tieneMarcadas = Array.isArray(datos.marcadas);
  const tieneRepes = datos.repetidas && typeof datos.repetidas === 'object';
  if (!tieneMarcadas && !tieneRepes) {
    alert('❌ El backup no tiene datos válidos.');
    return false;
  }

  const cuantasMarcadas = tieneMarcadas ? datos.marcadas.length : 0;
  const cuantasRepes = tieneRepes ? Object.keys(datos.repetidas).length : 0;
  const cuantosAmigos = datos.amigos ? Object.keys(datos.amigos).length : 0;

  const msg = `¿Restaurar este backup?\n\n` +
    `Nombre: ${datos.nombre || '(sin nombre)'}\n` +
    `Figuritas: ${cuantasMarcadas}\n` +
    `Repetidas: ${cuantasRepes}\n` +
    `Amigos: ${cuantosAmigos}\n\n` +
    `⚠️ Esto va a reemplazar todo lo que tenés cargado ahora.`;

  if (!confirm(msg)) return false;

  if (tieneMarcadas) {
    // Filtramos solo IDs válidos para evitar inyectar basura desde un backup adulterado
    const validos = new Set(ORDEN_FIGURITAS);
    marcadas = new Set(datos.marcadas.filter(id => typeof id === 'string' && validos.has(id)));
  }
  if (tieneRepes) {
    const validos = new Set(ORDEN_FIGURITAS);
    const limpio = {};
    Object.entries(datos.repetidas).forEach(([id, c]) => {
      const n = parseInt(c, 10);
      if (validos.has(id) && Number.isFinite(n) && n > 0 && n < 1000) limpio[id] = n;
    });
    repetidas = limpio;
  }
  if (typeof datos.nombre === 'string') miNombre = datos.nombre.slice(0, 30);
  if (datos.amigos && typeof datos.amigos === 'object') {
    // Limitamos cantidad de amigos para evitar bloating
    const entradas = Object.entries(datos.amigos).slice(0, MAX_AMIGOS);
    const limpio = {};
    entradas.forEach(([nombre, a]) => {
      if (typeof nombre !== 'string' || !a || typeof a !== 'object') return;
      const validos = new Set(ORDEN_FIGURITAS);
      const m = Array.isArray(a.marcadas) ? a.marcadas.filter(id => typeof id === 'string' && validos.has(id)) : [];
      const r = {};
      if (a.repetidas && typeof a.repetidas === 'object') {
        Object.entries(a.repetidas).forEach(([id, c]) => {
          const n = parseInt(c, 10);
          if (validos.has(id) && Number.isFinite(n) && n > 0 && n < 1000) r[id] = n;
        });
      }
      limpio[nombre.slice(0, 30)] = { marcadas: m, repetidas: r, fecha: typeof a.fecha === 'number' ? a.fecha : Date.now() };
    });
    amigos = limpio;
  }

  marcarBackupHecho();
  guardar();
  render();
  alert('✅ Backup restaurado con éxito');
  return true;
};

const descargarBackup = () => {
  const txt = generarTextoBackup();
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0, 10);
  const safeName = (miNombre || 'album').replace(/[^a-zA-Z0-9]/g, '_') || 'album';
  a.href = url;
  a.download = `Album-Mundial-2026_${safeName}_${fecha}.txt`;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  marcarBackupHecho();
  render();
};

// Compartir backup vía Web Share API (con archivo .txt) o WhatsApp (texto)
const compartirBackupWpp = () => {
  const txt = generarTextoBackup();

  // El backup es muy largo. La mejor estrategia en iOS es:
  // 1) Si Web Share API soporta files, usarla (se procesa internamente sin
  //    bloqueo de popup porque es navigator.share nativo).
  // 2) Si no, abrir WhatsApp DIRECTAMENTE con el texto (sincrónico).
  try {
    const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
    const fecha = new Date().toISOString().slice(0, 10);
    const safeName = (miNombre || 'album').replace(/[^a-zA-Z0-9]/g, '_') || 'album';
    const fileName = `Album-Mundial-2026_${safeName}_${fecha}.txt`;
    const file = new File([blob], fileName, { type: 'text/plain' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      // navigator.share es la única forma confiable de compartir archivos
      // desde móvil. iOS Safari la soporta desde iOS 15.
      navigator.share({
        files: [file],
        title: 'Backup Álbum Mundial 2026',
        text: 'Backup de mi álbum del Mundial 2026.',
      }).then(() => {
        marcarBackupHecho();
        render();
      }).catch((err) => {
        if (err && err.name === 'AbortError') return;
        // Si el usuario cancela o falla, mandamos el backup como texto
        compartirWhatsApp(txt);
        marcarBackupHecho();
        render();
      });
      return;
    }
  } catch (err) {
    // si falla, caemos al fallback
  }

  // Fallback: enviamos el backup completo como texto de WhatsApp
  // (igual queda guardado en el chat, que es lo que importa)
  compartirWhatsApp(txt);
  marcarBackupHecho();
  render();
};

const restaurarBackupDesdeArchivo = (file) => {
  if (!file) return;
  if (file.size > MAX_BYTES_ARCHIVO_BACKUP) {
    alert('❌ El archivo es demasiado grande (máximo 5 MB). No parece un backup válido de esta app.');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const contenido = e.target.result;
    if (typeof contenido !== 'string' || contenido.length > MAX_LEN_TEXTO_BACKUP) {
      alert('❌ El archivo es demasiado grande para procesarlo.');
      return;
    }
    const datos = parsearTextoBackup(contenido);
    if (datos) {
      aplicarBackup(datos);
      return;
    }
    // Compatibilidad: backups viejos en formato JSON puro
    try {
      const datosJson = JSON.parse(contenido);
      aplicarBackup(datosJson);
    } catch (err) {
      alert('❌ No se pudo leer el archivo.\n\nAsegurate de que sea un backup generado por esta app (archivo .txt que arranca con "📋 BACKUP - Mi Álbum Mundial 2026").');
    }
  };
  reader.onerror = () => alert('❌ Hubo un problema al leer el archivo.');
  reader.readAsText(file);
};

const restaurarBackupDesdeTexto = (texto) => {
  if (!texto || !texto.trim()) {
    alert('Pegá el contenido del backup antes de restaurar.');
    return;
  }
  if (texto.length > MAX_LEN_TEXTO_BACKUP) {
    alert('❌ El texto es demasiado grande para procesarlo.');
    return;
  }
  const datos = parsearTextoBackup(texto);
  if (datos) {
    aplicarBackup(datos);
    return;
  }
  // Por si pegaron solo el JSON
  try {
    const datosJson = JSON.parse(texto);
    aplicarBackup(datosJson);
  } catch (err) {
    alert('❌ No reconocí ese contenido como un backup válido.\n\nAsegurate de copiar el mensaje completo, incluyendo las líneas BACKUP-INICIO y BACKUP-FIN.');
  }
};

// Snapshot del HTML LIMPIO de la app, sin datos del usuario. Se captura una
// sola vez antes del primer render para que al compartir nunca filtremos
// el nombre, el código personal, las marcas o los amigos.
let HTML_LIMPIO_SNAPSHOT = null;
const tomarSnapshotLimpio = () => {
  try {
    // Clonamos documentElement; sobre el clon vaciamos #app y #boot.
    const clon = document.documentElement.cloneNode(true);
    const appEl = clon.querySelector('#app');
    if (appEl) appEl.innerHTML = '';
    const bootEl = clon.querySelector('#boot');
    if (bootEl && bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
    // Removemos estilos inyectados en runtime por Tailwind CDN (no son necesarios:
    // cuando el amigo abra el archivo, Tailwind volverá a generarlos).
    clon.querySelectorAll('style[data-tailwind], style[id^="tailwind"], style[data-tw]').forEach(s => s.remove());
    HTML_LIMPIO_SNAPSHOT = '<!DOCTYPE html>\n' + clon.outerHTML;
  } catch (e) {
    HTML_LIMPIO_SNAPSHOT = null;
  }
};

const obtenerHtmlLimpio = () => {
  // Si por algún motivo no tenemos snapshot, hacemos uno on-the-fly.
  if (!HTML_LIMPIO_SNAPSHOT) tomarSnapshotLimpio();
  return HTML_LIMPIO_SNAPSHOT || ('<!DOCTYPE html>\n' + document.documentElement.outerHTML);
};

const compartirApp = () => {
  try {
    const htmlLimpio = obtenerHtmlLimpio();
    const blob = new Blob([htmlLimpio], { type: 'text/html' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({
        files: [file],
        title: 'Mi Álbum Mundial 2026',
        text: '⚽ Te paso esta app para llevar el control del álbum del Mundial 2026. Abrila en tu celu y empezá a marcar tus figuritas.',
      }).catch((err) => {
        if (err && err.name !== 'AbortError') {
          descargarApp();

      });
      return;
    }
  } catch (err) {
    // sigue al fallback
  }
  descargarApp();
};

const compartirWhatsApp = (texto) => {
  // Si estamos dentro de un WebView embebido (como el de WhatsApp en iPhone),
  // no podemos abrir WhatsApp desde ahí. Copiamos al portapapeles y avisamos.
  if (WEBVIEW_INFO.esWebView) {
    let copiado = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = texto;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.contentEditable = 'true';
      ta.readOnly = false;
      const range = document.createRange();
      range.selectNodeContents(ta);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ta.setSelectionRange(0, 999999);
      copiado = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) {}

    if (copiado) {
      alert('📋 El mensaje se copió al portapapeles.\n\nAbrí WhatsApp, elegí el contacto y pegá el mensaje (manteniendo apretado en el cuadro de texto).\n\n💡 Para que estos botones funcionen automáticamente, abrí la app en Safari (los tres puntos arriba → "Abrir en Safari").');
    } else {
      window.prompt('Tocá y mantené apretado el texto para copiarlo, después pegalo en WhatsApp:', texto);
    }
    return;
  }

  // Navegador normal: crear un <a> y clickearlo sincrónicamente
  const textoEncoded = encodeURIComponent(texto);
  const url = `https://wa.me/?text=${textoEncoded}`;
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    if (a.parentNode) a.parentNode.removeChild(a);
  }, 100);
};

const copiarTexto = async (texto) => {
  // Safari/iOS requiere que esto se ejecute en un handler de evento síncrono.
  // Probamos navigator.clipboard primero (requiere https o file://),
  // y caemos a execCommand si falla.
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(texto);
      return true;
    }
  } catch (e) {
    // sigue al fallback
  }
  // Fallback con textarea
  try {
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    ta.style.pointerEvents = 'none';
    document.body.appendChild(ta);
    // iOS necesita selección explícita
    ta.contentEditable = 'true';
    ta.readOnly = false;
    const range = document.createRange();
    range.selectNodeContents(ta);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    ta.setSelectionRange(0, 999999);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e2) {
    return false;
  }
};

  compartirWhatsApp(txt);
};

const compartirFaltantes = () => {
  let txt = `⚽ ¡Hola! Estas son las figuritas del Álbum Mundial 2026 que me FALTAN:\n\n`;
  let hay = false;
  todosLosEquipos.forEach(eq => {
    const f = faltantesEquipo(eq.code);
    if (f.length > 0) { hay = true; txt += `${eq.nombre} (${eq.code}): ${f.join(', ')}\n`; }
  });
  const fwcF = [];
  for (let i = 1; i <= FWC_TOTAL; i++) if (!marcadas.has(`FWC${i}`)) fwcF.push(i);
  if (fwcF.length) { hay = true; txt += `\nFWC: ${fwcF.join(', ')}\n`; }
  const ccF = [];
  for (let i = 1; i <= CC_TOTAL; i++) if (!marcadas.has(`CC${i}`)) ccF.push(i);
  if (ccF.length) { hay = true; txt += `CC: ${ccF.join(', ')}\n`; }
  if (!hay) { alert('¡No te falta ninguna! 🎉'); return; }
  txt += `\n¿Tenés alguna repetida? 🙏`;
  compartirWhatsApp(txt);
};

const compartirRepetidas = () => {
  let txt = `⚽ ¡Hola! Tengo estas figuritas REPETIDAS del Álbum Mundial 2026 para cambiar:\n\n`;
  let hay = false;
  todosLosEquipos.forEach(eq => {
    const r = repesEquipo(eq.code);
    if (r.lista.length > 0) {
      hay = true;
      const items = r.lista.map(x => x.cant > 1 ? `${x.n} (x${x.cant})` : `${x.n}`).join(', ');
      txt += `${eq.nombre} (${eq.code}): ${items}\n`;
    }
  });
  const fwcR = [];
  for (let i = 1; i <= FWC_TOTAL; i++) {
    const c = repetidas[`FWC${i}`] || 0;
    if (c > 0) fwcR.push(c > 1 ? `${i} (x${c})` : `${i}`);
  }
  if (fwcR.length) { hay = true; txt += `\nFWC: ${fwcR.join(', ')}\n`; }
  const ccR = [];
  for (let i = 1; i <= CC_TOTAL; i++) {
    const c = repetidas[`CC${i}`] || 0;
    if (c > 0) ccR.push(c > 1 ? `${i} (x${c})` : `${i}`);
  }
  if (ccR.length) { hay = true; txt += `CC: ${ccR.join(', ')}\n`; }
  if (!hay) { alert('Todavía no cargaste ninguna repetida.'); return; }
  txt += `\n¿Te sirve alguna? 🤝`;
  compartirWhatsApp(txt);
};

const escapeAttr = (s) => String(s).replace(/"/g, '&quot;').replace(/'/g, "&#39;");
const escapeHtml = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const renderCasillaTengo = (id, n, esp) => {
  const tiene = marcadas.has(id);
  const cls = tiene
    ? 'bg-blue-600 text-white shadow-sm'
    : 'bg-gray-100 text-gray-500 active:bg-gray-200';
  return `<button data-id="${escapeAttr(id)}" data-action="toggle" class="aspect-square rounded-lg text-[10px] font-semibold transition-all ${cls}">
    <div class="flex flex-col items-center justify-center h-full leading-none">
      <span class="text-[10px] font-bold">${n}</span>
      ${esp ? `<span class="text-[8px] mt-0.5 ${tiene ? 'opacity-90' : 'opacity-70'}">${esp}</span>` : ''}
    </div>
  </button>`;
};

const renderCasillaRepe = (id, n, esp) => {
  const cant = repetidas[id] || 0;
  const tiene = marcadas.has(id);
  let bg, text;
  if (cant > 0) { bg = 'bg-amber-500 text-white shadow-sm'; text = `+${cant}`; }
  else if (tiene) { bg = 'bg-blue-50 text-blue-600 border border-blue-200'; text = ''; }
  else { bg = 'bg-gray-100 text-gray-400'; text = ''; }

  return `<div class="aspect-square rounded-lg ${bg} relative flex flex-col items-center justify-center">
    <div class="text-[10px] font-bold leading-none">${n}</div>
    ${esp ? `<div class="text-[8px] mt-0.5 ${cant > 0 || tiene ? '' : 'opacity-60'}">${esp}</div>` : ''}
    ${text ? `<div class="text-[8px] mt-0.5 font-bold">${text}</div>` : ''}

      <button data-id="${escapeAttr(id)}" data-action="restar-repe" class="w-5 h-5 rounded-full bg-white border border-gray-300 text-gray-700 text-[11px] font-bold leading-none active:bg-gray-100 shadow-sm">−</button>

};

        items.forEach(({id, cant}) => {

// Eventos
document.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'toggle') toggle(btn.dataset.id);
  else if (action === 'sumar-repe') sumarRepe(btn.dataset.id);
  else if (action === 'restar-repe') restarRepe(btn.dataset.id);
  else if (action === 'marcar-equipo') marcarEquipo(btn.dataset.code);
  else if (action === 'reset') resetTodo();
  else if (action === 'copiar-url') {
    const url = window.location.href;
    // Si es file:// no tiene sentido copiar, mostramos instrucciones
    if (url.startsWith('file:') || url.startsWith('blob:')) {
      window.prompt('Esta app está guardada como archivo en tu celular. Tocá los tres puntos (•••) arriba y elegí "Abrir en Safari" para usarla bien.', 'Abrí desde Archivos > Safari');
      return;
    }
    try {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.contentEditable = 'true';
      ta.readOnly = false;
      const range = document.createRange();
      range.selectNodeContents(ta);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ta.setSelectionRange(0, 999999);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) {
        alert('✅ Dirección copiada.\n\nAhora abrí Safari y pegala en la barra de direcciones.');
      } else {
        window.prompt('Copiá esta dirección y pegala en Safari:', url);
      }
    } catch (e) {
      window.prompt('Copiá esta dirección y pegala en Safari:', url);
    }
  }
  else if (action === 'tab') cambiarTab(btn.dataset.tab);
  else if (action === 'compartir-codigo-wpp') {
    // Capturamos el nombre sin re-renderizar (un render reemplaza el DOM
    // y Safari iOS pierde el contexto del click, bloqueando la apertura)
    const inp = document.getElementById('input-nombre');
    if (inp) {
      miNombre = (inp.value || '').trim().slice(0, 30);
      try { localStorage.setItem(STORAGE_KEY_NOMBRE, miNombre); } catch (e) {}
    }
    compartirCodigo();
  }
  else if (action === 'copiar-codigo') {
    const inp = document.getElementById('input-nombre');
    if (inp) {
      miNombre = (inp.value || '').trim().slice(0, 30);
      try { localStorage.setItem(STORAGE_KEY_NOMBRE, miNombre); } catch (e) {}
    }
    compartirSoloCodigo();
  }
  else if (action === 'importar-amigo') {
    const inp = document.getElementById('input-codigo-amigo');
    if (inp) {
      importarAmigo(inp.value);
      inp.value = '';
    }
  }
  else if (action === 'borrar-amigo') borrarAmigo(btn.dataset.nombre);
  else if (action === 'match-wpp') {
    const nombre = btn.dataset.nombre;
    const a = amigos[nombre];
    if (a) {
      const amigoData = { tengo: new Set(a.marcadas), repes: a.repetidas || {} };
      const match = calcularMatch(amigoData);
      compartirMatchPorWpp(nombre, match);
    }
  }
  else if (action === 'compartir-app') compartirApp();
  else if (action === 'descargar-app') descargarApp();
  else if (action === 'descargar-backup') descargarBackup();
  else if (action === 'compartir-backup-wpp') compartirBackupWpp();
  else if (action === 'abrir-restaurar-texto') {
    const bloque = document.getElementById('bloque-restaurar-texto');
    if (bloque) {
      bloque.classList.remove('hidden');
      const ta = document.getElementById('input-restore-texto');
      if (ta) setTimeout(() => ta.focus(), 50);
    }
  }
  else if (action === 'cancelar-restaurar-texto') {
    const bloque = document.getElementById('bloque-restaurar-texto');
    if (bloque) bloque.classList.add('hidden');
    const ta = document.getElementById('input-restore-texto');
    if (ta) ta.value = '';
  }
  else if (action === 'restaurar-desde-texto') {
    const ta = document.getElementById('input-restore-texto');
    if (ta) restaurarBackupDesdeTexto(ta.value);
  }
  else if (action === 'compartir-mama') compartirParaPadres('mama');
  else if (action === 'compartir-papa') compartirParaPadres('papa');
  else if (action === 'compartir-familia') compartirParaPadres('familia');
  else if (action === 'dismiss-backup') descartarRecordatorioBackup();
});

// Sincronizamos cambios entre pestañas/ventanas abiertas del mismo navegador
window.addEventListener('storage', (e) => {
  if (!e.key || !e.key.startsWith('album-mundial-2026')) return;
  try {
    if (storage) {
      const t = storage.getItem(STORAGE_KEY_TENGO);
      marcadas = t ? new Set(JSON.parse(t)) : new Set();
      const r = storage.getItem(STORAGE_KEY_REPES);
      repetidas = r ? JSON.parse(r) : {};
      const nm = storage.getItem(STORAGE_KEY_NOMBRE);
      miNombre = nm || '';
      const am = storage.getItem(STORAGE_KEY_AMIGOS);
      amigos = am ? JSON.parse(am) : {};
      cambiosDesdeBackup = parseInt(storage.getItem(STORAGE_KEY_BACKUP_CAMBIOS) || '0', 10) || 0;
      ultimoBackupTs = parseInt(storage.getItem(STORAGE_KEY_BACKUP_FECHA) || '0', 10) || 0;
      render();
    }
  } catch (err) {}
});
</script>
